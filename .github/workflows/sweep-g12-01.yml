name: sweep-g12-01-what-the-window-buys-on-a-bad-link

# THE REPEATED SWEEP NOTE 014 ASKED FOR AND NOBODY RAN.
#
# Note 014 measured the asynchrony window's speedup ONCE and marked the number
# unreliable in its own text: "These are single runs. One measurement per
# configuration, no repeats, no seeds, no error bars. Timing is the noisiest
# thing this project has ever measured... The 7.3x is an observation, not a
# measured effect, and it needs a proper repeated sweep before it goes in GOALS."
#
# It never got one. The 7.3x is the number behind the claim that obeying C1 is
# not merely a constraint but the thing that makes the design USABLE, and a claim
# that load-bearing should not rest on one unrepeated run.
#
# AGREEMENT IS THE HEADLINE, NOT SPEED. Under an impaired link a network can be
# slow or it can be WRONG, and a run that merely finished does not distinguish
# them. The summariser refuses to report any timing if any cell disagreed with
# the single-process model.
#
# PREDICTIONS (full text and refutation conditions in the sweep file):
#   P1  agreement holds at every window and every impairment -- if this fails
#       the window is a correctness bug, not a performance knob
#   P2  the speedup is real and survives repeats on the impaired link
#   P3  it is much smaller on a clean link, because the window hides LATENCY
#   P4  seconds/step falls monotonically with window, then flattens
#
# NAMED IMPAIRMENT, NOT AMBIENT NOISE. A test under random loss fails for reasons
# unrelated to the change under test and the answer is always to re-run it, which
# is how a suite stops being believed. C2 asks for a stated bound; this states
# it.
#
# REPEATS ARE SEPARATE JOBS rather than a loop inside one, so a cell that dies
# loses one repeat rather than three and the per-run values stay visible -- this
# project's per-seed rule applied to wall-clock.
#
# COST: 24 jobs, four nodes each, dominated by container startup. Join is ~0.7 s
# per node and the model work is under 0.2 s even at 64 nodes, so each cell is
# seconds and the matrix is minutes.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-testbed
  cancel-in-progress: false

jobs:
  window:
    strategy:
      fail-fast: false
      matrix:
        window: [1, 2, 4, 8]
        link: [clean, impaired]
        repeat: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: window ${{ matrix.window }} on a ${{ matrix.link }} link, run ${{ matrix.repeat }}
        run: |
          set -o pipefail
          mkdir -p out
          if [ "${{ matrix.link }}" = "clean" ]; then
            python testbed/run.py --nodes 4 --width 16 --steps 40 \
              --window ${{ matrix.window }} \
              | tee out/X-clean-w${{ matrix.window }}-r${{ matrix.repeat }}.json
          else
            python testbed/run.py --nodes 4 --width 16 --steps 40 \
              --window ${{ matrix.window }} \
              --delay 80ms --jitter 20ms --loss 2% \
              | tee out/X-impaired-w${{ matrix.window }}-r${{ matrix.repeat }}.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: g12-01-${{ matrix.link }}-w${{ matrix.window }}-r${{ matrix.repeat }}
          path: out/*.json

  aggregate:
    needs: [window]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g12-01-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 24" | tee summary.txt
          python -m tools.summarise_g12_01 | tee -a summary.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g12-01-summary
          path: |
            summary.txt
            out/*.json
