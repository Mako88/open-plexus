name: sweep-g13-04-is-ambiguity-detectable

# CAN THE MODEL TELL, BEFORE SEARCHING, WHETHER SEARCHING WOULD HELP?
#
# g13-03 measured search doing exactly what it was built for and damaging the
# case it was not:
#     search4 - walk at out-degree 1       -0.054
#     search4 - walk at out-degree >= 2    +0.092
# The test set is about half of each, so they cancel and the overall gain is
# +0.008, inside 2 SE. The tie is not evidence against search -- it is evidence
# search should not run unconditionally.
#
# THE BAR IS DECISION 93's 0.628, the best any identity-free confidence signal
# reached there when fitted WITH the labels. A margin that cannot beat that is a
# confidence heuristic wearing a new name.
#
# The candidate is search.decode_margin -- the gap between the top two
# candidates of the first decode. It is not a confidence signal in 93's sense:
# when one relation is bound to a key the decode is peaked, and when several are
# they compete, so it reads the superposition rather than guessing at it. That
# is an argument, and this project's record on arguments is poor, which is why
# it is measured before a gate is built.
#
# PREDICTIONS (full text in the script and the sweep file):
#   P1  decode margin AUC > 0.75            <- THE DECISION
#   P2  median at out-degree 1 is >2x the median at 2+
#   P3  the ENDPOINT margin does not beat it by more than 0.05 AUC
#   P4  separation holds at every width
#   P5  AUC stays below 0.95 -- above that suggests the label is leaking
#
# ACCURACY IS NOT MEASURED HERE. The out-degree is task metadata a running
# system cannot see; it is the LABEL, and the margin is the proxy scored
# against it.
#
# COST, from the dearest cell (width 256), measured by --cost: 21.5 ms per
# training sequence, 0.6 min per cell, 3 cells per job, ~2 min per job. 8 jobs.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweep
  cancel-in-progress: false

jobs:
  margin:
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - name: seed ${{ matrix.seed }}, widths 64/128/256
        run: |
          set -o pipefail
          mkdir -p out
          python experiments/g13_04_is_ambiguity_detectable.py \
            --seed ${{ matrix.seed }} --json out/seed-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g13-04-seed-${{ matrix.seed }}
          path: out/*.json

  aggregate:
    needs: [margin]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: g13-04-seed-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "seeds returned: $(ls out/*.json 2>/dev/null | wc -l) of 8" | tee summary.txt
          python -m tools.summarise_g13_04 | tee -a summary.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g13-04-summary
          path: |
            summary.txt
            out/*.json
