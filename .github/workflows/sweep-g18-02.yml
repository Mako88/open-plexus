name: sweep-g18-02-can-the-store-contribute-a-single-positive-bit

# THE QUESTION DECISION 136 LEFT, AND IT IS BIGGER THAN ADDRESSING.
#
# At word level, tuned, the model scores 9.185 bits/word. The same model with
# NOTHING ever written to its store scores 9.187. Every word-level bit this model
# earns is the readout bias, and the memory contributes nothing at any rate
# between 5e-4 and 2e-6 -- above that it is actively harmful.
#
# So the next question is not which address to use. It is whether this store can
# contribute a single positive bit at word level at all.
#
# THE ARM THAT MAKES IT A FAIR TEST: single keys. A pair key addresses (t-1, t);
# a single key addresses the previous token alone, which makes the store a BIGRAM
# in vector form -- note 033's ceiling, and here the ceiling is the point rather
# than the limit:
#
#     word bigram (NGram)     7.848    what the shape can reach
#     word unigram            8.068
#     the model, tuned        9.185    pair keys
#     the model, NO STORE     9.187    the bias alone
#
# **A bigram beats the bias-only model by 1.34 bits.** If the store cannot get
# anywhere near that when addressed exactly the way a bigram is addressed, the
# problem is not the address space -- it is the store.
#
# g17-01 reported single keys DIVERGING at word level. That was at lr 0.05 with
# no cap, both of which decision 136 replaced; the whole point of this run is that
# the setting which made single keys unusable is gone.
#
# THE SECOND AXIS IS WIDTH, because "the store holds nothing useful" and "the
# store is too small to hold anything useful" are different findings and only one
# of them is about the architecture.
#
# PREDICTIONS, and this run has three rather than five (John, 2026-07-29: keep the
# gate, the rail and the falsifier; the rest is ceremony):
#
#   P1  THE GATE. Some cell beats `nostore` by more than 0.10 bits. If nothing
#       does at any width or key scheme, the store contributes nothing at word
#       level and the architecture line needs a different question.
#   P2  THE RAIL. `nostore` is flat in width and key scheme -- it has no store to
#       vary. If it moves by more than 0.02, the ablation is not ablating and
#       every comparison here is unreadable.
#   P3  THE FALSIFIER, stated as a prediction so it can be scored: single keys at
#       width 512 do NOT reach the bigram at 7.848. Reaching it would mean the
#       store works and pair keys were the whole problem, which would reopen the
#       addressing line rather than close it.
#
# COST: 24 cells, one per job, ~2-6 min each -- width 512 is the dear one and the
# estimate comes from it. ONE SEED: this is a calibration of what the store can
# do at all, and a second seed buys nothing until something beats `nostore`.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweep
  cancel-in-progress: false

jobs:
  store:
    strategy:
      fail-fast: false
      matrix:
        keys: [pair, single]
        arm: [floor, nostore]
        width: [128, 512]
        # THE RATE IS SWEPT AGAIN RATHER THAN INHERITED. 5e-6 was settled for
        # PAIR keys at width 128, and carrying it into a different key scheme
        # and a different width is exactly the mistake note 046 is about -- one
        # line after the note that found it. Three rates bracket the settled
        # one; a cell that chooses an edge says so in the summary.
        lr: ["0.00005", "0.000005", "0.0000005"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - name: ${{ matrix.keys }} keys, ${{ matrix.arm }}, d${{ matrix.width }}, lr ${{ matrix.lr }}
        run: |
          set -o pipefail
          mkdir -p out
          python experiments/g18_01_does_storing_by_concept_make_words_learnable.py \
            --seed 0 --arm ${{ matrix.arm }} --groups 128 \
            --keys ${{ matrix.keys }} --width ${{ matrix.width }} \
            --bias 1 --cap 5.0 --decay 1.0 --lr ${{ matrix.lr }} \
            --json out/${{ matrix.arm }}-${{ matrix.keys }}-d${{ matrix.width }}-${{ matrix.lr }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g18-02-${{ matrix.arm }}-${{ matrix.keys }}-d${{ matrix.width }}-${{ matrix.lr }}
          path: out/*.json

  aggregate:
    needs: [store]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: g18-02-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 24" | tee summary.txt
          python -m tools.summarise_g18_02 | tee -a summary.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g18-02-summary
          path: |
            summary.txt
            out/*.json
