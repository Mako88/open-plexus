name: sweep-g9-09-a-small-node-in-a-wide-network

# g9-08 swept d_model and refused nine of fifteen cells: below width 32 the
# UNGATED model scores below chance, so the task was impossible rather than the
# gate failing. A narrow NETWORK is not a small NODE.
#
# g7-02 had it right: `partitions` cuts d_model into groups, each with its own
# readout over its own dimensions, and run(partition=g) asks one group alone.
# Training is unchanged -- the delta rule reads every group's own error whatever
# partition says -- so this is the deployment question.
#
# PRE-DISPATCH CONTROL, width 64, delay 8, one seed, reduced training. This is
# the check g9-08 did not run:
#
#   groups  node    none  oracle     tag     gap   implied recovery
#        1    64   0.894   1.000   0.911   0.106              0.16
#        2    32   0.789   1.000   0.878   0.211              0.42
#        4    16   0.714   1.000   0.814   0.286              0.35
#        8     8   0.408   0.992   0.569   0.583              0.28
#       16     4   0.406   0.608   0.494   0.203              0.43
#
# Every row is usable -- the floor arm stays far above the trivial floor of
# 0.125 down to a node of four numbers, where g9-08's equivalent had collapsed to
# 0.037. The ORACLE breaks at 16 groups (0.608), which bounds the question: below
# a node of about eight there is no ceiling left to recover a fraction of.
#
# slots 32 and fade 0.95 are FROZEN at a working point chosen at d_model 32 in
# one process. That is this grid's standing risk and is named in the sweep file.
#
# 15 jobs of (partitions, delay), about 10 minutes each at width 64.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweeps
  cancel-in-progress: false

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        partitions: [1, 2, 4, 8, 16]
        delay: [1, 8, 20]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: partitions ${{ matrix.partitions }} delay ${{ matrix.delay }}
        run: python experiments/g9_05_the_tag.py --width 64 --partitions ${{ matrix.partitions }} --slots 32 --fade 0.95 --scale ${{ matrix.delay }} --lr 0.05 --workers 3 --json out/X-${{ matrix.partitions }}-${{ matrix.delay }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g9-09-${{ matrix.partitions }}-${{ matrix.delay }}
          path: out/*.json

  aggregate:
    needs: [node]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g9-09-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 15" | tee summary.txt
          python -m tools.summarise_g9_09 | tee -a summary.txt
      - name: Summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: g9-09-summary
          path: |
            summary.txt
            out/*.json
