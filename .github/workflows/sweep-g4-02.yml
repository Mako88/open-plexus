name: sweep-g4-02-machine-shaped-churn

# Does the SHAPE of churn matter, or only how much of it there is?
#
# G3 removed dimensions uniformly at random, which was right when no dimension
# belonged to anybody. With `partitions` each machine owns a contiguous block, so
# a departing machine removes a block -- and a scatter and a block are not the
# same damage.
#
# 18 jobs, 13 conditions each. Costed before dispatch: 4.1 hours serial, worst
# job (d=128) ~17 minutes.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweeps
  cancel-in-progress: false

jobs:
  churn:
    strategy:
      fail-fast: false
      matrix:
        width: [64, 128]
        seed: [1, 2, 3]
        lr: ["0.02", "0.05", "0.1"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: d ${{ matrix.width }} lr ${{ matrix.lr }} seed ${{ matrix.seed }}
        run: python experiments/g4_02_machine_churn.py --width ${{ matrix.width }} --lr ${{ matrix.lr }} --seed ${{ matrix.seed }} --json out/C-${{ matrix.width }}-${{ matrix.lr }}-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g4-02-${{ matrix.width }}-${{ matrix.lr }}-${{ matrix.seed }}
          path: out/*.json

  aggregate:
    needs: [churn]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g4-02-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 18" | tee summary.txt
          python tools/summarise_g4_02.py | tee -a summary.txt
      - name: Summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: g4-02-summary
          path: |
            summary.txt
            out/*.json
