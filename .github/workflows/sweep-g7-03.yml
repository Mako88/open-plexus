name: sweep-g7-03-how-to-spend-a-machine

# A machine holding C dimensions can run one node of width C, or C nodes of width
# 1, or anything between. All use the same memory and arithmetic; they differ in
# how many independent readouts the machine keeps. Which is best is the deployment
# decision, and the interior of that grid has never been measured -- every earlier
# sweep pinned either the node width or the cluster size.
#
# Nodes hosted by one machine pool for free, so a cluster is naturally a machine.
#
# 56 jobs. Costed: 12.5 hours serial, worst job 14.6 minutes.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweeps
  cancel-in-progress: false

jobs:
  allocation:
    strategy:
      fail-fast: false
      matrix:
        width: [1, 2, 4, 8, 16, 32, 64]
        mode: [open, gated]
        lr: ["0.02", "0.05", "0.1", "0.2"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: node width ${{ matrix.width }} ${{ matrix.mode }} lr ${{ matrix.lr }}
        run: python experiments/g7_03_allocation.py --width ${{ matrix.width }} --mode ${{ matrix.mode }} --lr ${{ matrix.lr }} --json out/A-${{ matrix.width }}-${{ matrix.mode }}-${{ matrix.lr }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g7-03-${{ matrix.width }}-${{ matrix.mode }}-${{ matrix.lr }}
          path: out/*.json

  aggregate:
    needs: [allocation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g7-03-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 56" | tee summary.txt
          python tools/summarise_g7_03.py | tee -a summary.txt
      - name: Summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: g7-03-summary
          path: |
            summary.txt
            out/*.json
