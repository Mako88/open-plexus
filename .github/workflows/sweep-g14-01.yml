name: sweep-g14-01-does-closure-pass-g0

# G0's ACCEPTANCE TEST, applied to a task this project DESIGNED rather than
# borrowed -- which makes it more necessary, not less: a task built to have a
# property tends to be measured as though it has it.
#
# GOALS section 4: before any learning mechanism is written, the task must show
# substantial headroom between a random frozen substrate and a strong non-local
# reference, multi-seed, with a constant predictor's base rate alongside.
#
# THE ENTAILED HALF IS THE TASK. A stated fact's relation is drawn at random and
# its binding key(S, O) -> R is written one step AFTER the prediction point, so
# the stated half is a FLOOR by construction and every arm should sit near
# majority there. Averaging the two would hide what G0 exists to check.
#
# THE REFERENCE IS CONVERGED, and the first version was not: at width 64 / 4
# epochs it scored 0.148 on entailed, BELOW the 0.198 majority floor, and this
# experiment reported the task FAILING G0. At width 128 / 16 epochs it reaches
# 0.277; 40 epochs buys 0.007 more. A G0 verdict is a statement about the
# REFERENCE as much as about the task.
#
# PREDICTIONS (full text in the script and the sweep file):
#   P1  frozen sits at or below majority on ENTAILED
#   P2  attention beats majority on ENTAILED by more than 0.15
#   P3  headroom (attention - frozen) on ENTAILED > 0.15      <- THE GATE
#   P4  every arm sits near majority on STATED                <- see the note
#   P5  local lands between frozen and attention on ENTAILED
#
# COST from the dearest arm (attention, width 128, 16 epochs), measured by
# --cost: 24.7 ms per training sequence, 0.5 min per cell, ~2 min per job.
# majority and frozen are nearly free. 8 jobs.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweep
  cancel-in-progress: false

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - name: seed ${{ matrix.seed }}, four arms
        run: |
          set -o pipefail
          mkdir -p out
          python experiments/g14_01_does_closure_pass_g0.py \
            --seed ${{ matrix.seed }} --json out/seed-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g14-01-seed-${{ matrix.seed }}
          path: out/*.json

  aggregate:
    needs: [gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: g14-01-seed-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "seeds returned: $(ls out/*.json 2>/dev/null | wc -l) of 8" | tee summary.txt
          python -m tools.summarise_g14_01 | tee -a summary.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g14-01-summary
          path: |
            summary.txt
            out/*.json
