name: sweep-g1-09-alphabet

# Does the width the local rule needs track the ALPHABET rather than the load?
#
# g1-06 refuted the interference account and proposed this replacement, which has
# been untested since. Run at g1-08's tuned key_scale rather than the default
# that made the earlier curves unreliable.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweeps
  cancel-in-progress: false

jobs:
  alphabet:
    strategy:
      fail-fast: false
      matrix:
        keys: [8, 16, 32, 64, 128]
        width: [16, 24, 32, 48, 64]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: keys ${{ matrix.keys }}, width ${{ matrix.width }}
        run: python experiments/g1_09_alphabet.py --keys ${{ matrix.keys }} --width ${{ matrix.width }} --json out/k${{ matrix.keys }}-w${{ matrix.width }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g1-09-k${{ matrix.keys }}-w${{ matrix.width }}
          path: out/*.json

  aggregate:
    needs: alphabet
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g1-09-k*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 25" | tee summary.txt
          python tools/summarise_g1_09.py | tee -a summary.txt
      - name: Summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: g1-09-summary
          path: |
            summary.txt
            out/*.json
