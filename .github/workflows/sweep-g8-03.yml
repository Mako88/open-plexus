name: sweep-g8-03-a-pool-you-have-to-win

# Does a finite pool hold N constant, and does that recover anything?
#
# Note 015: synaptic capture is competitive over a FINITE protein pool, and note
# 010 implemented the tag while leaving the pool unbounded. That omission
# predicts g8-01's worst number -- retrieval goes as sqrt(d/N), a threshold fires
# at a RATE so N grows with sequence length, and recovery must fall with length.
# Measured: 0.05 at seq 192 to -0.00 at 1536. A pool of k sets a QUANTITY.
#
# THE MEASUREMENT IS THE SHAPE OF THE RECOVERY CURVE, NOT ITS HEIGHT. Flat at
# 0.02 means the mechanism does exactly what it was built for and does not help,
# which is a different finding from "it fails" and must not be merged with it.
# The summariser reports a slope column for that reason.
#
# capture-0 is unbounded consolidation, i.e. g8-01's failing arm, so this grid
# contains the result it is trying to beat rather than a re-derivation of it.
#
# 12 jobs of (seq_len, lr): five arms x three seeds each, seeds spread across 3
# worker processes. Costed from g8-02's measured 22m28s serial for 12 trainings
# at seq 768, i.e. ~1.87 min per training there and ~3.75 at 1536. Worst job is
# 15 trainings at 1536, about 56 minutes serial and ~20 with workers -- inside
# the 90-minute timeout. About 5.25 hours serial in total.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweeps
  cancel-in-progress: false

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        seqlen: [192, 384, 768, 1536]
        lr: ["0.02", "0.05", "0.1"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: Cores on this runner
        run: nproc
      - name: seq ${{ matrix.seqlen }} lr ${{ matrix.lr }}
        run: python experiments/g8_03_capture.py --seqlen ${{ matrix.seqlen }} --lr ${{ matrix.lr }} --workers 3 --json out/X-${{ matrix.seqlen }}-${{ matrix.lr }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g8-03-${{ matrix.seqlen }}-${{ matrix.lr }}
          path: out/*.json

  aggregate:
    needs: [capture]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g8-03-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 12" | tee summary.txt
          python -m tools.summarise_g8_03 | tee -a summary.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g8-03-summary
          path: |
            summary.txt
            out/*.json
