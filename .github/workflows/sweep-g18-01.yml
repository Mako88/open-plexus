name: sweep-g18-01-does-storing-by-concept-make-words-learnable

# g17-01'S BLOCKER, ATTACKED AT THE ADDRESS SPACE.
#
# The model does not learn word-level text at all: 90,000 words buys 0.038 bits
# over uniform and it sits 2.65 bits worse than a word unigram (8.068 by NGram;
# the 9.323 in g17-01's record was wrong -- decision 135). The reason g17-01
# found is address sparsity: with pair keys, 1,733 words make 36,299 distinct
# addresses over 90,000 words, so almost every address is written once and the
# store memorises hapaxes.
#
# `keys.ByConcept` addresses the store by GROUPS of words instead. Measured
# before dispatch: K=128 collapses 36,299 addresses to 3,438 and lifts mean
# recurrence from 2.5 to 26.2. The readout still predicts surfaces -- store by
# concept, emit by word.
#
# TWO CONTROLS, BECAUSE THERE ARE TWO WAYS TO BE WRONG. `permuted` keeps the
# group SIZES and shuffles the membership, so the address-space statistics are
# matched and only the meaning is gone. `shuffled` destroys the meaning at the
# source by fitting the content index on a scrambled stream. An arm beating
# `floor` but not its controls is a real finding and a smaller one: fewer
# addresses, however chosen.
#
# THE BRAKE IS NOT TUNING. The first concept cell overflowed to NaN (|Wo| reached
# 1.6e63), and the reason is the defect itself -- surface-level sparsity was the
# only thing holding the store's norm down, so collapsing the address space
# restores recurrence AND removes the brake at once. Probed at 20,000 words
# against a 10.759 uniform, concept-128: no brake 36.2, decay 0.999 36.0, decay
# 0.997 39.6, decay 0.99 10.78, cap 5.0 10.50, cap+decay 10.50. A cap holds where
# a fade does not and a fade on top buys nothing -- and a cap keeps the store's
# window, where a fade throws away the recurrence the grouping just bought. The
# `divergence` job runs cap 0, the model's own default, so the blow-up is
# recorded rather than assumed.
#
# PREDICTIONS (full text in the script and the sweep file):
#   P1  THE GATE -- the best concept arm beats floor by more than 0.10 bits
#   P2  CONTROL -- it beats permuted and shuffled at the same K by 0.05
#   P3  bits per word is non-monotonic in K, minimum at an intermediate value
#   P4  RAIL -- addresses fall and recurrence rises at every K (the "square of
#       the grouping ratio" form was predicted and refuted before dispatch; the
#       fall is linear, and the script records why)
#   P5  no arm reaches the word unigram at 8.068
#
# WHAT WOULD REFUTE THE PROPOSAL: P1 failing at every K with P4 passing. The
# address space collapsed exactly as designed and the model still learned
# nothing, so sparsity was not the binding constraint and note 042's account of
# the wall needs the next explanation rather than a bigger sweep.
#
# COST, from the dearest cell (any single arm at 90,000 words, one epoch, width
# 128): ~2 min on a runner, measured by g18-00's 30 cells finishing in 3m12s
# wall. A five-K job is ~10 min. 30 jobs. The bias-off block runs ONE seed
# rather than three: it is a robustness check against the configuration every
# earlier number used, not the measurement.
#
# `context` and `current` group ONE coordinate of the pair key rather than both,
# and they sit exactly between the floor and full grouping by construction --
# 13,113 and 12,776 addresses at K=128 against 36,299 and 3,438. They carry the
# same clustering as `concept`, so a difference between the three is about the
# coordinate rather than about the grouping. P2's controls stay attached to
# `concept`: `permuted` and `shuffled` group both coordinates, so scoring a
# one-sided arm against them would be two changes in one comparison.

# WHAT g18-00 ALREADY SAYS, so this run is a verdict rather than a question.
# At K=128, each arm at its own best rate:
#
#     floor            9.185     no grouping
#     stratified-128   9.185     only the rare tail grouped
#     current-128      9.252     one coordinate grouped
#     context-128      9.591     the other coordinate grouped
#     concept-128      9.985     both coordinates grouped
#     word unigram     8.068     still 1.12 bits ahead of the best arm
#
# The arms are ordered exactly by how much resolution the grouping destroys, and
# recurrence rises tenfold across that table while buying nothing anywhere. P1's
# gate is already failing at one K in five ways.
#
# THIS RUN EXISTS TO MAKE THAT A VERDICT: the whole K axis, three seeds, and the
# two controls. A refutation measured at one K and one seed is a signal.
#
# `nostore` writes nothing at all, so the readout has only its bias. If it lands
# where the tuned floor lands, the store is inert at this rate and every arm
# comparison here is between two inert models -- which would matter more than
# anything else in the table.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweep
  cancel-in-progress: false

env:
  # SETTLED BY g18-00, three passes, runs 30425355572 / 30425842494 /
  # 30426222929. The floor's choice is interior at last -- 5e-6 by held-out
  # training text, after two passes in which every arm sat on the grid's edge.
  #
  # ONE RATE FOR EVERY ARM, and the objection is answered rather than dodged:
  # `concept-128`'s own best is 2e-6, worth 0.03 bits over 5e-6. Its deficit
  # against the floor is 0.80. Running every arm at one rate handicaps the
  # mechanism by 4% of the gap it has to close, and running each at its own
  # would make the K axis incomparable across arms.
  LR: "0.000005"
  CAP: "5.0"

jobs:
  grid:
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]
        arm: [floor, nostore, concept, stratified, context, current, permuted, shuffled]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - name: seed ${{ matrix.seed }}, arm ${{ matrix.arm }}
        run: |
          set -o pipefail
          mkdir -p out
          python experiments/g18_01_does_storing_by_concept_make_words_learnable.py \
            --seed ${{ matrix.seed }} --arm ${{ matrix.arm }} \
            --bias 1 --cap ${{ env.CAP }} --lr ${{ env.LR }} --decay 1.0 \
            --json out/${{ matrix.arm }}-${{ matrix.seed }}-bias1.json
      - uses: actions/upload-artifact@v4
        with:
          name: g18-01-${{ matrix.arm }}-${{ matrix.seed }}-bias1
          path: out/*.json

  nobias:
    strategy:
      fail-fast: false
      matrix:
        arm: [floor, nostore, concept, stratified, context, current, permuted, shuffled]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - name: bias off, arm ${{ matrix.arm }}
        run: |
          set -o pipefail
          mkdir -p out
          python experiments/g18_01_does_storing_by_concept_make_words_learnable.py \
            --seed 0 --arm ${{ matrix.arm }} \
            --bias 0 --cap ${{ env.CAP }} --lr ${{ env.LR }} --decay 1.0 \
            --json out/${{ matrix.arm }}-0-bias0.json
      - uses: actions/upload-artifact@v4
        with:
          name: g18-01-${{ matrix.arm }}-0-bias0
          path: out/*.json

  aggregate:
    needs: [grid, nobias]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: g18-01-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 32" | tee summary.txt
          python -m tools.summarise_g18_01 | tee -a summary.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g18-01-summary
          path: |
            summary.txt
            out/*.json
