name: sweep-g18-04-does-g17-01s-premise-survive-the-correction

# THE PREMISE THAT TURNED THIS LINE, RE-ASKED ON A HARNESS THAT TRAINS CORRECTLY.
#
# g17-01 concluded "the model does not learn word-level text at all": 90,000
# words buying 0.038 bits over uniform. That is the finding note 042's
# architecture pass was built on, and it is why the last week went to addressing.
#
# Decision 138 found its training call targets the CURRENT token where the model
# predicts the NEXT one. So the premise was measured on a mistrained readout and
# has to be re-established before anything else rests on it.
#
# THIS RUNS g17-01'S EXACT CONFIGURATION -- width 256, two epochs, lr 0.05, no
# cap, key_scale 1.0, pair keys, bias OFF, 90,000 words -- with the target fixed
# and nothing else changed. Anything other than a straight reproduction attempt
# would answer a different question.
#
# The `bias 1` pair is the interesting half rather than the control: g17-01 never
# had a bias term, so its floor is the store working alone. Decision 139 says the
# store's contribution is prior-shaped, and this is where that gets its
# word-level, own-configuration statement.
#
# PREDICTIONS (a gate, a rail, a falsifier)
#
#   P1  THE GATE. `floor` at bias 0 lands within 0.10 of g17-01's 10.721. The
#       premise SURVIVES the correction and the architecture line's starting
#       point stands.
#   P2  THE RAIL. `nostore` at bias 0 sits at uniform, 10.759, within 0.05. No
#       store and no prior is nothing to predict with.
#   P3  THE FALSIFIER. `floor` at bias 0 does NOT beat the word unigram at 8.068.
#       Beating it would mean the correction rescues the premise entirely and
#       everything built on "word level is unlearnable" needs revisiting.
#
# WHAT WOULD BE THE LARGEST RESULT: P1 refuted downward -- the corrected model
# learning materially more than 0.038 bits. That would say the architecture pivot
# was made on an artefact.
#
# COST: 4 cells, one per job. Width 256 at two epochs is ~4x the cells in
# g18-02/03, so ~8 min each.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweep
  cancel-in-progress: false

jobs:
  premise:
    strategy:
      fail-fast: false
      matrix:
        arm: [floor, nostore]
        bias: ["0", "1"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - name: g17-01 config, ${{ matrix.arm }}, bias ${{ matrix.bias }}
        run: |
          set -o pipefail
          mkdir -p out
          python experiments/g18_01_does_storing_by_concept_make_words_learnable.py \
            --seed 0 --arm ${{ matrix.arm }} --groups 128 \
            --units words --keys pair --width 256 --epochs 2 \
            --bias ${{ matrix.bias }} --cap 0 --decay 1.0 \
            --key-scale 1.0 --lr 0.05 \
            --json out/premise-${{ matrix.arm }}-b${{ matrix.bias }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g18-04-${{ matrix.arm }}-b${{ matrix.bias }}
          path: out/*.json

  aggregate:
    needs: [premise]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: g18-04-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 4" | tee summary.txt
          python -m tools.summarise_g18_04 | tee -a summary.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g18-04-summary
          path: |
            summary.txt
            out/*.json
