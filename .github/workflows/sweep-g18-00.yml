name: sweep-g18-00-what-does-each-arm-need-to-run-at-all

# THE CALIBRATION THAT HAS TO COME FIRST, AND IT MAY UNDO A STANDING CONCLUSION.
#
# g17-01 concluded the model does not learn word-level text at all: 90,000 words
# buying 0.038 bits over uniform. Every cell behind that ran at lr 0.05 -- the
# value every character-level sweep in this project used.
#
# A local probe at 20,000 words with a readout bias:
#
#     lr 0.05    floor 10.186   concept-128 DIVERGED (|Wo| 1.6e63)
#     lr 0.01    floor  9.851   concept-128 10.353
#     lr 0.005   floor  9.804   concept-128 10.349
#     lr 0.001   floor    ...   concept-128 10.428
#
# Two things follow, and both change g18-01 before it is dispatched.
#
# FIRST: the divergence that looked like a property of concept addressing is a
# learning rate tuned for a store that returns near-nothing. At 0.005 the same
# arm runs with no cap and no decay at all. Decision 132's finding, in the other
# component.
#
# SECOND, and larger: the FLOOR moves 0.38 bits at 20,000 words. If that holds at
# 90,000, then "the model cannot learn word-level text" is a statement about one
# hyper-parameter, and g18-01 would have measured its mechanism against a
# handicapped baseline -- the confound this project retracted g10-09 for.
#
# AND THE RATE ALONE IS NOT ENOUGH AT SCALE, which is why `cap` is the second
# axis rather than a constant. lr 0.005 holds concept-128 at 20,000 words and
# **blows up at 90,000** -- 36.9 bits against a 10.759 uniform, finite and
# useless. More data is more writes into the same collapsed address space, so
# the setting that survives a probe does not survive the run. Both axes are
# swept, per arm, at the size the sweep actually uses.
#
# CHOSEN BY HELD-OUT TRAINING TEXT, never by the test set. `fit_error` is
# reported beside `error` for exactly this, and the summariser sorts by the
# former and prints the latter. Each arm gets its own best setting: comparing a
# mechanism at a rate tuned for the baseline is the confound g10-09 was
# retracted for, and it runs in both directions.
#
# COST: 30 cells, one per job, ~6 min each at 90,000 words and width 128.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweep
  cancel-in-progress: false

jobs:
  rate:
    strategy:
      fail-fast: false
      matrix:
        lr: ["0.05", "0.01", "0.005", "0.001", "0.0005"]
        cap: ["0", "5.0"]
        arm: [floor, concept, stratified]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      # ONE K ONLY for the grouped arms. This run is about the learning rate;
      # sweeping K here would spend fifteen times the compute to answer a
      # question g18-01 is already designed to answer.
      - name: lr ${{ matrix.lr }}, cap ${{ matrix.cap }}, arm ${{ matrix.arm }}
        run: |
          set -o pipefail
          mkdir -p out
          python experiments/g18_01_does_storing_by_concept_make_words_learnable.py \
            --seed 0 --arm ${{ matrix.arm }} --groups 128 \
            --bias 1 --cap ${{ matrix.cap }} --decay 1.0 --lr ${{ matrix.lr }} \
            --json out/${{ matrix.arm }}-lr${{ matrix.lr }}-cap${{ matrix.cap }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g18-00-${{ matrix.arm }}-lr${{ matrix.lr }}-cap${{ matrix.cap }}
          path: out/*.json

  aggregate:
    needs: [rate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: g18-00-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 30" | tee summary.txt
          python -m tools.summarise_g18_00 | tee -a summary.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g18-00-summary
          path: |
            summary.txt
            out/*.json
