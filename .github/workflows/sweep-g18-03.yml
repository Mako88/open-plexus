name: sweep-g18-03-has-the-store-ever-contributed-anything-on-text

# THE QUESTION DECISION 137 LEFT, AND IT IS THE LARGEST ONE THIS LINE HAS ASKED.
#
# At WORD level the store contributes nothing: three learning rates, two widths
# and two key schemes, best gain +0.002 against its own no-store ablation, and
# -0.68 when addressed as a bigram (g18-02, decision 137).
#
# At CHARACTER level the model reaches 5.17 against a 6.00 uniform, and that
# looks like the store working. **But every character-level run in this project
# had `readout_bias` OFF.** So the store's contribution there was never measured
# against a model that can express a prior -- and `Wo`, a vocab x d linear map,
# can carry a prior by itself.
#
#     if character-level `nostore` with the bias ON lands near the floor,
#     THE STORE HAS NEVER CONTRIBUTED ON TEXT,
#     and the whole text line has been measuring a learned prior.
#
# That is a bigger claim than anything in g18-00 or g18-02, and it is one run
# away. It is also the claim most likely to be WRONG in an interesting way: at
# 65 symbols a bigram is a genuinely strong model and the store may well be
# carrying it.
#
# BOTH UNITS IN ONE MATRIX, so the comparison is within one harness, one
# calibration procedure and one set of bars rather than across two scripts.
#
# THE BIAS IS AN AXIS rather than a default, because `bias 0` is the
# configuration every character-level number in the comparison set was measured
# with. A `nostore` arm at `bias 0` has no store AND no prior, so it should sit
# at uniform -- which is the second rail.
#
# ⚠ HELD: THE FIRST PASS FAILED ITS REPRODUCTION AND SO WILL THIS ONE UNTIL THE
# CHARACTER FLOOR IS EXPLAINED.
#
# Pass 1 (run 30431349857) put the character `bias 0` floor at 5.986 against a
# 6.000 uniform, where decision 63 puts the same model near 5.53. A local re-run
# with all five of g15-01's settings restored -- single keys, decay 0.997, no
# cap, key_scale 0.5, lr 0.05 -- returned 5.9965. **So the five inherited
# constants were NOT the cause**, and something else in this harness differs from
# the character-level pipeline.
#
# Until a cell of this script reproduces ~5.53, its character column measures an
# instrument rather than a hypothesis, and P1 must stay unscored. That is
# decision 131's lesson, which cost a whole matrix the first time.
#
# PREDICTIONS (three: a gate, a rail, a falsifier)
#
#   P0  THE REPRODUCTION, and it comes before the rest. The character `bias 0`
#       floor lands within 0.10 of decision 63's ~5.53. **If it does not, no
#       other prediction here may be scored.**
#
#   P1  THE GATE. At character level with the bias ON, `floor` beats `nostore`
#       by more than 0.30 bits. That is the store contributing on text, and it
#       is what every character-level result has been assumed to show.
#   P2  THE RAIL. At `bias 0`, `nostore` sits within 0.05 of uniform (6.00 at
#       this vocabulary). It has no store and no prior, so it has nothing to
#       predict with; if it scores better than that, something else is learning
#       and every ablation in this line is misattributed.
#   P3  THE FALSIFIER. Character-level `floor` with the bias ON does NOT reach
#       the character bigram. Reaching it would mean the store does at character
#       level exactly what it refused to do at word level, and the difference
#       between the two units becomes the whole question.
#
# WHAT WOULD BE THE LARGEST RESULT: P1 refuted. The store would have contributed
# nothing on text at either unit, and every text number this project has is a
# statement about a linear readout.
#
# COST: 24 cells, one per job, ~2-4 min each. Both units, both biases, three
# rates, floor and nostore.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweep
  cancel-in-progress: false

jobs:
  units:
    strategy:
      fail-fast: false
      matrix:
        # PER-UNIT CONFIGURATION, because the first pass inherited FIVE word-level
        # constants into the character arm and its floor came back at 5.986 where
        # decision 63 puts the same model near 5.53 -- a model that had learned
        # essentially nothing, measured as though it were the comparison set.
        #
        # The character column is g15-01's `build`: single keys, decay 0.997, no
        # cap, key_scale 0.5, rates around 0.05. The word column is g18-00's
        # settled corner. Written as `include` rather than a cross product
        # because the two units genuinely do not share settings.
        include:
          - {units: characters, arm: floor,   bias: "0", keys: single, decay: "0.997", cap: "0", scale: "0.5", lr: "0.05"}
          - {units: characters, arm: floor,   bias: "0", keys: single, decay: "0.997", cap: "0", scale: "0.5", lr: "0.02"}
          - {units: characters, arm: floor,   bias: "0", keys: single, decay: "0.997", cap: "0", scale: "0.5", lr: "0.005"}
          - {units: characters, arm: nostore, bias: "0", keys: single, decay: "0.997", cap: "0", scale: "0.5", lr: "0.05"}
          - {units: characters, arm: nostore, bias: "0", keys: single, decay: "0.997", cap: "0", scale: "0.5", lr: "0.02"}
          - {units: characters, arm: nostore, bias: "0", keys: single, decay: "0.997", cap: "0", scale: "0.5", lr: "0.005"}
          - {units: characters, arm: floor,   bias: "1", keys: single, decay: "0.997", cap: "0", scale: "0.5", lr: "0.05"}
          - {units: characters, arm: floor,   bias: "1", keys: single, decay: "0.997", cap: "0", scale: "0.5", lr: "0.02"}
          - {units: characters, arm: floor,   bias: "1", keys: single, decay: "0.997", cap: "0", scale: "0.5", lr: "0.005"}
          - {units: characters, arm: nostore, bias: "1", keys: single, decay: "0.997", cap: "0", scale: "0.5", lr: "0.05"}
          - {units: characters, arm: nostore, bias: "1", keys: single, decay: "0.997", cap: "0", scale: "0.5", lr: "0.02"}
          - {units: characters, arm: nostore, bias: "1", keys: single, decay: "0.997", cap: "0", scale: "0.5", lr: "0.005"}
          # PAIR keys at character level too, because the word line ran on pair
          # keys and a difference between the units must not be a difference
          # between key schemes.
          - {units: characters, arm: floor,   bias: "1", keys: pair,   decay: "0.997", cap: "0", scale: "0.5", lr: "0.05"}
          - {units: characters, arm: floor,   bias: "1", keys: pair,   decay: "0.997", cap: "0", scale: "0.5", lr: "0.005"}
          - {units: characters, arm: nostore, bias: "1", keys: pair,   decay: "0.997", cap: "0", scale: "0.5", lr: "0.05"}
          - {units: characters, arm: nostore, bias: "1", keys: pair,   decay: "0.997", cap: "0", scale: "0.5", lr: "0.005"}
          - {units: words, arm: floor,   bias: "0", keys: pair, decay: "1.0", cap: "5.0", scale: "1.0", lr: "0.000005"}
          - {units: words, arm: nostore, bias: "0", keys: pair, decay: "1.0", cap: "5.0", scale: "1.0", lr: "0.000005"}
          - {units: words, arm: floor,   bias: "1", keys: pair, decay: "1.0", cap: "5.0", scale: "1.0", lr: "0.000005"}
          - {units: words, arm: nostore, bias: "1", keys: pair, decay: "1.0", cap: "5.0", scale: "1.0", lr: "0.000005"}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - name: ${{ matrix.units }} ${{ matrix.arm }} ${{ matrix.keys }} bias${{ matrix.bias }} lr${{ matrix.lr }}
        run: |
          set -o pipefail
          mkdir -p out
          python experiments/g18_01_does_storing_by_concept_make_words_learnable.py \
            --seed 0 --arm ${{ matrix.arm }} --groups 128 \
            --units ${{ matrix.units }} --keys ${{ matrix.keys }} --width 128 \
            --bias ${{ matrix.bias }} --cap ${{ matrix.cap }} \
            --decay ${{ matrix.decay }} --key-scale ${{ matrix.scale }} \
            --lr ${{ matrix.lr }} \
            --json out/${{ matrix.units }}-${{ matrix.arm }}-${{ matrix.keys }}-b${{ matrix.bias }}-${{ matrix.lr }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g18-03-${{ matrix.units }}-${{ matrix.arm }}-${{ matrix.keys }}-b${{ matrix.bias }}-${{ matrix.lr }}
          path: out/*.json

  aggregate:
    needs: [units]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: g18-03-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 20" | tee summary.txt
          python -m tools.summarise_g18_03 | tee -a summary.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g18-03-summary
          path: |
            summary.txt
            out/*.json
