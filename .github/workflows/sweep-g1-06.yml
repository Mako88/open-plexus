name: sweep-g1-06-interference

# Two questions, two matrices.
#
# The first asks whether the width the local rule needs grows with the number of
# bindings held. One job per (n_pairs, width, seed) cell — 126 of them — because
# the expensive cells cost ~50x the cheap ones and a coarser split would let one
# condition set the wall clock for everything.
#
# The second asks whether decaying the memory helps. It is small and runs
# alongside.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweeps
  cancel-in-progress: false

jobs:
  interference:
    strategy:
      fail-fast: false
      matrix:
        pairs: [2, 4, 8]
        width: [24, 32, 48, 64, 96, 128, 192]
        seed: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: pairs ${{ matrix.pairs }}, width ${{ matrix.width }}, seed ${{ matrix.seed }}
        run: python experiments/g1_06_interference.py --pairs ${{ matrix.pairs }} --width ${{ matrix.width }} --seed ${{ matrix.seed }} --json out/p${{ matrix.pairs }}-w${{ matrix.width }}-s${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g1-06-int-p${{ matrix.pairs }}-w${{ matrix.width }}-s${{ matrix.seed }}
          path: out/*.json

  decay:
    strategy:
      fail-fast: false
      matrix:
        decay: ["1.0", "0.99", "0.95", "0.9"]
        seed: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: decay ${{ matrix.decay }}, seed ${{ matrix.seed }}
        run: python experiments/g1_06_interference.py --sweep decay --decay ${{ matrix.decay }} --seed ${{ matrix.seed }} --json out/d${{ matrix.decay }}-s${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g1-06-decay-${{ matrix.decay }}-s${{ matrix.seed }}
          path: out/*.json

  aggregate:
    needs: [interference, decay]
    # always(), so a matrix that lost cells still reports, with the count shown.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g1-06-int-*
          path: interference
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: g1-06-decay-*
          path: decay
          merge-multiple: true
      - name: Combine
        run: |
          {
            echo "interference cells: $(ls interference/*.json 2>/dev/null | wc -l) of 126"
            python experiments/harness.py --aggregate "interference/*.json"
            echo
            echo "decay cells: $(ls decay/*.json 2>/dev/null | wc -l) of 24"
            python experiments/harness.py --aggregate "decay/*.json"
          } | tee summary.txt
      - name: Summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: g1-06-summary
          path: |
            summary.txt
            interference/*.json
            decay/*.json
