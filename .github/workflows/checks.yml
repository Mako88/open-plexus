name: checks

# The two commands CLAUDE.md names, on every push. The second is the one that
# matters: rule 10 is unenforceable without a harness that verifies the tests can
# actually fail, and a suite nobody has seen go red is not evidence.

on:
  push:
  pull_request:
  workflow_dispatch:

# One checks run per ref at a time, and a new push CANCELS the previous one.
#
# This is not tidiness. Each run is seven jobs -- the suite plus six mutation
# shards -- and a session that commits ten times queues seventy jobs against a
# sweep's fifteen. Measured: four superseded `checks` runs were sitting in front
# of sweep-g9-11 while it had not started a single job, and the sweeps have their
# own concurrency group so they cannot jump the line.
#
# Cancelling a superseded run loses nothing: the commit that superseded it
# contains the code the cancelled run was checking, and its own run covers it.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `check_commit_messages.py` scans recent messages for a word a shell ate,
          # and the default depth of 1 would give it nothing to scan -- a check that
          # passes by having no input is the quietest way to be useless. It also
          # refuses a history this shallow, so the two guards agree.
          fetch-depth: 30
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      # First, because it takes a second and it is the only check that names
      # WHICH mutation is live when the source on disk is not the source anyone
      # means. Commit 3634a23 shipped `rank = strength` -- a live mutation --
      # because `git add -A` ran while a background harness had the file open,
      # and the suite was never run against the tree being committed.
      - name: Verify the source is not mutated
        run: python tools/mutate.py --verify
      - name: Test suite
        run: python -m unittest discover -s tests -t . -q
      - name: Verify every workflow flag is one its script accepts
        run: python tools/check_workflows.py
      - name: Duplicated function bodies (ratchet -- new copies only)
        run: python tools/check_duplication.py
      - name: Every module imports
        run: python tools/check_imports.py
      # `check_imports.py` skips experiments/ on purpose. This closes that gap
      # by starting each sweep with --help, which argparse answers before the
      # script does any work -- so a sweep that cannot run stops being invisible
      # to every gate at once. It found three scripts whose --help crashed on a
      # cp1252 console the day it was written.
      - name: Every experiment script starts
        run: python tools/check_experiments.py
      # A module nothing calls gets rediscovered and rebuilt. That is the
      # failure that forced this project's restructure, and it is the one
      # check here that guards the RECORD rather than the code.
      - name: Nothing is built and left unwired
        run: python tools/check_orphans.py
      # The README held at 140 lines through a week of heavy work and
      # still grew: one option line reached 1,263 characters. Line count
      # was the wrong dimension to watch.
      - name: The record stays readable
        run: python tools/check_record.py
      - name: No commit message had a word eaten by a shell
        run: python tools/check_commit_messages.py
      - name: Every pinned number says where it came from
        run: python tools/check_constants.py

  # The harness runs one full suite per mutation, so it is serial time and
  # nothing else. MEASURED on 57d8112, the first full run to complete: 168
  # mutations, six shards at 28, 18 to 35 minutes each, all caught. Serial that
  # is about two and a half hours -- the figure here previously said "85
  # mutations at fifteen seconds each, two minutes a job", which is what made a
  # local full run look affordable.
  #
  # It was ALSO being run locally, which was pure duplication and was the thing
  # blocking local work: experiments refuse to run while the source is mutated
  # (experiments/harness.py), so an eight-minute harness run stopped everything
  # else. Locally the right command is now `--only <the mutations I just added>`.
  #
  # Shards are by position, not by hash, so the same mutation lands in the same
  # shard across runs and two logs can be compared line for line -- but ONLY
  # while the list is unchanged. Inserting a mutation mid-list shifts every one
  # after it into a different shard, which is how `the-deadline-fires-immediately`
  # appeared in shard 0 for the first time (note 054).
  mutations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: Verify the tests can fail (shard ${{ matrix.shard }} of 6)
        run: python tools/mutate.py --shard ${{ matrix.shard }}/6
