name: sweep-g1-10-real-load

# Third attempt at explaining what sets the crossing. n_pairs was flat (g1-06),
# n_keys was flat (g1-09), and reading the store showed both are a small fraction
# of what the memory actually holds: it binds EVERY consecutive pair, so the load
# is seq_len — pinned at 96 in every sweep this project has run.
#
# One job per (seq_len, width). The seq_len=384 cells cost 4x the 96 ones on top
# of the width scaling, so splitting on both axes matters here.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweeps
  cancel-in-progress: false

jobs:
  seqlen:
    strategy:
      fail-fast: false
      matrix:
        seqlen: [48, 96, 192, 384]
        width: [16, 24, 32, 48, 64, 96, 128]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: seq ${{ matrix.seqlen }}, width ${{ matrix.width }}
        run: python experiments/g1_10_seqlen.py --seqlen ${{ matrix.seqlen }} --width ${{ matrix.width }} --json out/s${{ matrix.seqlen }}-w${{ matrix.width }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g1-10-s${{ matrix.seqlen }}-w${{ matrix.width }}
          path: out/*.json

  aggregate:
    needs: seqlen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g1-10-s*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 28" | tee summary.txt
          python tools/summarise_g1_10.py | tee -a summary.txt
      - name: Summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: g1-10-summary
          path: |
            summary.txt
            out/*.json
