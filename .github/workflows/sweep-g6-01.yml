name: sweep-g6-01-forgetting

# At what width does catastrophic forgetting stop, and does sparsity move it?
#
# Three pre-dispatch controls reshaped this sweep. The headline they already
# produced is not about sparsity: forgetting is a function of WIDTH. At width 64
# the model forgets everything (0.779 -> 0.008); at 240 it forgets nothing
# (0.927 -> 0.923), dense either way.
#
# 96 jobs. Costed: 2.6 hours serial, worst job 3.4 minutes -- cheaper than the
# first grid despite more cells, because the wide rows where nothing happens are
# dropped and the band where the transition actually sits is sampled eight times.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweeps
  cancel-in-progress: false

jobs:
  forgetting:
    strategy:
      fail-fast: false
      matrix:
        width: [48, 56, 64, 72, 80, 96, 112, 128]
        scale: ["0", "4", "8", "16"]
        lr: ["0.02", "0.05", "0.1"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: d ${{ matrix.width }} active ${{ matrix.scale }} lr ${{ matrix.lr }}
        run: python experiments/g6_01_forgetting.py --width ${{ matrix.width }} --scale ${{ matrix.scale }} --lr ${{ matrix.lr }} --json out/F-${{ matrix.width }}-${{ matrix.scale }}-${{ matrix.lr }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g6-01-${{ matrix.width }}-${{ matrix.scale }}-${{ matrix.lr }}
          path: out/*.json

  aggregate:
    needs: [forgetting]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g6-01-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 96" | tee summary.txt
          python tools/summarise_g6_01.py | tee -a summary.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g6-01-summary
          path: |
            summary.txt
            out/*.json
