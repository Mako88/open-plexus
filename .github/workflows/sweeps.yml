# The measurements, one runner each, on request.
#
# WHY THIS EXISTS: `tests.yml` excludes `kind=sweep` for a good reason -- a sweep
# asserts nothing, it prints a grid, and several hundred runs of twenty thousand
# rounds took the suite past its timeout and killed the run that would have
# reported the real failures. So the measurements had nowhere to run but a
# developer's own machine, one at a time, for an hour at a stretch.
#
# AND ONE AT A TIME IS NOT A PREFERENCE, IT IS THE MEASUREMENT. `Parallelism.cs`
# disables xUnit parallelisation because numbers move with how busy the machine
# is: the walk's agreement with itself reads 0.8833 alone and 1.0000 under load.
# Two sweeps sharing one box produce two numbers neither of which is about the
# thing being swept.
#
# WHICH IS WHY THIS IS A MATRIX AND NOT A `-m` FLAG, and it is the same
# distinction `tests.yml` already draws. One class a runner is N serial runs at
# the load profile a serial run has; nothing overlaps that could have seen
# anything else overlap. The wall clock comes down and the numbers do not move.
name: sweeps

on:
  # ON REQUEST AND NEVER ON PUSH. These are hours of runner time and their output
  # is read by a person, so firing them on every commit would spend a great deal
  # to produce grids nobody asked for -- and would queue behind themselves.
  workflow_dispatch:
    inputs:
      only:
        description: "Substring of the sweep class to run, or blank for all"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # NEVER CANCEL A RUNNING MEASUREMENT. A half-finished sweep is not a partial
  # result, it is no result -- the grid prints when the fact returns.
  #
  # AND THE GROUP CARRIES THE INPUT, WHICH `tests.yml`'S DOES NOT AND SHOULD NOT.
  # Grouping by ref alone is right for a suite, where one run per branch is the
  # whole idea. It is wrong here: three sweeps dispatched at once are three
  # DIFFERENT measurements on one ref, and a per-ref group makes them queue behind
  # each other -- GitHub keeps at most one pending run per group, so the third
  # arrival cancelled the second at four seconds. Copied reasoning, wrong shape.
  group: sweeps-${{ github.ref }}-${{ inputs.only }}
  cancel-in-progress: false

jobs:
  # WHICH SWEEPS THE DISPATCH ASKED FOR, DECIDED BEFORE ANY RUNNER IS CLAIMED.
  #
  # THE FIRST VERSION STARTED EVERY ENTRY AND LET THE UNWANTED ONES EXIT EARLY, AND
  # THAT IS NOT CHEAP -- IT IS A RUNNER SLOT EACH. A matrix of twenty-six spawns
  # twenty-six jobs however fast twenty-five of them stop, and this account gets
  # twenty at once, so three single-sweep dispatches queued seventy-eight jobs and
  # starved the actual suite behind them. Skipping WORK is not skipping a JOB.
  plan:
    runs-on: ubuntu-latest

    outputs:
      sweeps: ${{ steps.pick.outputs.sweeps }}

    steps:
      # NAMED RATHER THAN DISCOVERED, WHICH IS WHY THE LIST IS HERE AND NOT A GLOB.
      # Scanning the assembly for the trait would make the matrix a function of the
      # tree, so a grid could appear or vanish with no commit saying so. Adding a
      # sweep is a line in a diff.
      # AND AN ENTRY MAY BE A CLASS OR ONE METHOD OF ONE, WHICH IS THE ONLY LEVER ON
      # WALL CLOCK HERE. The filter is a substring match on the fully-qualified name,
      # so `NamingYieldTests.Which_bar` is as valid an entry as `NamingYieldTests` --
      # and a class holding four grids of a couple of hundred runs each is four
      # runners' work sitting on one. Splitting it is not parallelising a
      # measurement: each runner is still one serial run at a serial run's load.
      #
      # SPLIT A CLASS WHEN IT HOLDS INDEPENDENT GRIDS, and leave it whole otherwise.
      # A dispatch naming the class still matches every method of it by substring, so
      # `only=NamingYieldTests` picks up every entry of it below and they land on a
      # runner each rather than all on one.
      #
      # AND A DUPLICATE ENTRY IS TWO RUNNERS DOING ONE JOB, which is invisible from the
      # dispatch notice because the list it prints is the list it was given. One crept
      # in here the first time an entry was removed and re-added.
      - id: pick
        env:
          ONLY: ${{ inputs.only }}
        run: |
          all='[
            "AbstainTests","AskedTests","BudgetCurveTests",
            "ArrangingTests.What_an_unbounded_repair_budget",
            "ArrangingTests.The_gap_between_what",
            "ArrangingTests.What_the_vote_costs",
            "ArrangingTests.And_the_other_half",
            "ArrangingTests.Whether_the_gap_is_a_fact",
            "ArrangingTests.Whether_the_gate_that_was_load_bearing",
            "ArrangingTests.Whether_distinct_children_are_damage",
            "ArrangingTests.Whether_shortening_a_scope_is_damage",
            "BudgetTests","ChoosingTests","FleetTests","FoldingTests",
            "ForkingTests.What_a_parents_attempts_buy",
            "ForkingTests.What_the_budget_caps",
            "GateCostTests","LatencyTests","MendingTests",
            "MonkTests","NarrowingTests","OverlapTests","PlacingTests",
            "NamingYieldTests.Which_bar_takes",
            "NamingYieldTests.Whether_a_run_past",
            "NamingYieldTests.What_the_minted_names",
            "NamingYieldTests.How_long_the_sound_rules",
            "NamingYieldTests.What_bounds_rung_fives_yield",
            "NamingYieldTests.And_a_real_populations_best_pair",
            "RecoveryTests.What_a_moving_target",
            "RecoveryTests.Whether_what_recovery_waits_for",
            "RecoveryTests.Whether_a_subsumption",
            "RecoveryTests.Whether_the_parents_that_must_relearn",
            "RecoveryTests.Whether_a_budget_on_children",
            "RecoveryTests.What_a_world_that_keeps_moving",
            "RecoveryTests.Whether_an_earned_budget_keeps",
            "CensusTests.Whether_subsumption_is_cutting",
            "CensusTests.Whether_a_parents_table_already_knows",
            "QueryCostTests","RefusalTests","ScalingTests",
            "SeparableTests",
            "SpeakingTests","SplitNamingTests","SplitRepairTests","SplitTests",
            "WideningTests.Whether_shortening_a_scope",
            "WideningTests.Whether_the_cost_of_widening"
          ]'

          if [ -z "$ONLY" ]; then
            picked=$(printf '%s' "$all" | jq -c '.')
          else
            picked=$(printf '%s' "$all" | jq -c --arg only "$ONLY" \
              '[.[] | select(contains($only))]')
          fi

          # AND A DISPATCH THAT MATCHED NOTHING DIES HERE RATHER THAN DOWNSTREAM.
          # The `if` on `sweep` turns an empty matrix into a SKIPPED job, and a run
          # whose only measurement was skipped still concludes `success` -- so a
          # sweep class not yet in the list above is indistinguishable from a grid
          # that ran. That is the pass-shaped failure this repo keeps finding,
          # wearing a workflow, and it cost a dispatch the first time a new sweep
          # was added. The list is named rather than discovered on purpose; this is
          # what makes forgetting to add to it loud.
          if [ -n "$ONLY" ] && [ "$picked" = "[]" ]; then
            echo "::error::'$ONLY' matches no sweep class. Add it to the list in" \
              "this file, or check the spelling."
            exit 1
          fi

          echo "sweeps=$picked" >> "$GITHUB_OUTPUT"
          echo "::notice::dispatching $picked"

  sweep:
    needs: plan

    # A DISPATCH NAMING NOTHING THAT EXISTS IS A TYPO, AND IT SHOULD LOOK LIKE ONE.
    # An empty matrix is a hard error rather than a skipped job, so the guard is
    # here and the notice above says what was actually chosen.
    if: needs.plan.outputs.sweeps != '[]'

    runs-on: ubuntu-latest

    # THE HEAVIEST GRID HERE IS SIX CELLS OVER FOUR WORLDS AT EIGHT SEEDS, which
    # is most of an hour on a developer's machine and slower on a runner. This is
    # under GitHub's own six-hour ceiling so a hung fact is killed by us with a
    # readable reason rather than by the platform without one.
    timeout-minutes: 330

    strategy:
      # A SWEEP THAT DIES TELLS US NOTHING ABOUT THE OTHERS, and the others are
      # the point. `tests.yml` says the same thing for the same reason.
      fail-fast: false

      # ONE CLASS A RUNNER, AND ONLY THE CLASSES ASKED FOR. See `plan` above for
      # why this is computed rather than written out here.
      matrix:
        sweep: ${{ fromJSON(needs.plan.outputs.sweeps) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # THE SAME RESTORE `tests.yml` DOES, and the same reason it must hit rather
      # than fetch. Most sweeps here are on generated worlds and touch none of it;
      # the ones that do would otherwise pull six hundred megabytes per runner.
      - name: Restore corpora
        uses: actions/cache/restore@v4
        with:
          path: |
            corpora/tasks_1-20_v1-2
            corpora/CLEVR_v1.0
            corpora/tatoeba_eng.tsv
            corpora/clutrr_test.csv
            corpora/cifar-10-batches-bin
            corpora/encoders
          key: corpora-v3-${{ hashFiles('corpora/fetch.sh') }}

      - name: Build
        run: dotnet build --configuration Debug --nologo --no-incremental

      # DETAILED, BECAUSE THE GRID IS THE WHOLE OUTPUT. A sweep asserts nothing, so
      # at any quieter verbosity this step reports a pass and prints not one number
      # -- a green tick standing where the measurement should be, which is worse
      # than a failure because nobody goes looking.
      - name: Measure
        run: |
          dotnet test --configuration Debug --nologo --no-build \
            --filter "kind=sweep&FullyQualifiedName~${{ matrix.sweep }}" \
            --verbosity quiet --logger "console;verbosity=detailed" \
            | tee "${{ matrix.sweep }}.log"

      # KEPT AS A FILE AS WELL AS IN THE CONSOLE. A run's logs age out and a grid is
      # meant to be read against the one before it, so the numbers outlive the run
      # that produced them -- which is this repo's rule that a finding lives in the
      # commit and in the test, never only in a place that expires.
      - name: Keep the grid
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ matrix.sweep }}
          path: ${{ matrix.sweep }}.log
          if-no-files-found: warn
