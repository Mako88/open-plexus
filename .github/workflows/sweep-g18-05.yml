name: sweep-g18-05-does-the-store-carry-the-relational-tasks

# THE CONTROL THE WHOLE TEXT LINE RESTS ON, AND IT HAD NEVER BEEN RUN.
#
# Five sweeps on the corrected harness say the store contributes ~nothing on
# text (139, 140, 141). Every one of those records then says the same protective
# sentence: "this does not touch the relational line -- MQAR, kinship and the
# chains are solved through this store and no prior solves them."
#
# That sentence is an INFERENCE. It is a good one -- MQAR's symbols are drawn at
# random, so a prior genuinely cannot help -- but the `nostore` ablation that
# overturned four sweeps of text results had never been pointed at the results
# the project actually rests on.
#
# A local cell already says it plainly, at seed 0, bias 0:
#
#     floor     0.9975
#     nostore   0.0000        the trivial floor is 0.3438
#
# This runs it across three seeds and both bias settings so the number has the
# seeds the text results have.
#
# TWO INSTRUMENT FAILURES WERE CAUGHT BUILDING THIS, both of them note 046's
# mistake and both caught by the trivial floor before anything was dispatched:
#
#   decay 1.0            inherited from the word-level work; MQAR uses 0.99
#   autoregressive off   the dataclass default. With it off, the answer lives in
#                        `sequence.targets` and is NOT the next token, so the
#                        `np.roll(tokens, -1)` every MQAR script uses scores
#                        against the wrong symbol. Both arms returned 0.055.
#
# PREDICTIONS (a gate, a rail, a falsifier)
#
#   P1  THE GATE. `floor` beats `nostore` by more than 0.30 accuracy.
#   P2  THE RAIL. `nostore` at bias 0 does not exceed the trivial floor of
#       0.3438. It has nothing to recall from, so anything above guessing is
#       something else learning.
#   P3  THE FALSIFIER. The readout bias does NOT help: `floor` at bias 1 is
#       within 0.05 of `floor` at bias 0. MQAR's values are uniform by
#       construction, so a prior that paid here would mean the generator has a
#       base rate and every MQAR number is partly a base-rate score.
#
# COST: 12 cells over 6 jobs, ~3 min each.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweep
  cancel-in-progress: false

jobs:
  relational:
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]
        bias: ["0", "1"]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - name: seed ${{ matrix.seed }}, bias ${{ matrix.bias }}
        run: |
          set -o pipefail
          mkdir -p out
          python experiments/g18_05_does_the_store_carry_the_relational_tasks.py \
            --seed ${{ matrix.seed }} --bias ${{ matrix.bias }} \
            --json out/relational-${{ matrix.seed }}-b${{ matrix.bias }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g18-05-${{ matrix.seed }}-b${{ matrix.bias }}
          path: out/*.json

  aggregate:
    needs: [relational]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: g18-05-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 6" | tee summary.txt
          python -m tools.summarise_g18_05 | tee -a summary.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g18-05-summary
          path: |
            summary.txt
            out/*.json
