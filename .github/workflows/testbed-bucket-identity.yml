name: testbed-bucket-identity-the-grounding-store-in-containers

# THE HALF OF THE GROUNDING LINE THAT WAS NEVER SENT.
#
# `g32` and `g33` measured the statistic, the join, the derived bound and the
# sharded accumulator. Every one of them COUNTED crossings rather than sending
# them, and `openplexus/buckets.py` says so in its own docstring. This sends
# them: one container per node, a real Docker network, and a driver that owns
# nothing and reads every count back from the peer that holds it.
#
# The property is note 014's, unchanged from `testbed-identity.yml`: a network of
# containers must agree with the single-process model EXACTLY. A count is an
# integer and a wrong one is a bug, so there is no tolerance to set.
#
# CLEAN LINK ON PURPOSE, for the reason `testbed-identity.yml` gives: impairment
# is a SWEPT parameter, not ambient noise. A test under random loss fails for
# reasons unrelated to the change under test, and the response is always to
# re-run it, which is how a suite stops being believed. The impaired run is
# dispatch-only below.
#
# WHAT IT ASSERTS
#   agrees_with_one_process == true
#   mismatches == 0
#
# WHY IT EXISTS AT ALL. `testbed-identity.yml`'s own header records the lesson:
# the container harness was built, proved once, and left un-run for months, so
# every distributed claim rested on something nobody re-executed. This runs on
# every push that touches the grounding modules.

on:
  push:
    paths:
      - "openplexus/bucket_service.py"
      - "openplexus/bucket_peer.py"
      - "openplexus/buckets.py"
      - "openplexus/grounding.py"
      - "openplexus/node_main.py"
      - "openplexus/ownership.py"
      - "tools/bucket_drive.py"
      - "testbed/**"
      - ".github/workflows/testbed-bucket-identity.yml"
  workflow_dispatch:
    inputs:
      delay:
        description: "one-way netem delay, e.g. 40ms. Empty for a clean link"
        required: false
        default: ""
      jitter:
        description: "netem jitter, e.g. 10ms"
        required: false
        default: ""

concurrency:
  group: testbed-bucket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        nodes: [2, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: run the grounding store in containers
        run: |
          set -o pipefail
          python testbed/run.py --mode bucket --nodes ${{ matrix.nodes }} \
            ${{ github.event.inputs.delay && format('--delay {0}', github.event.inputs.delay) || '' }} \
            ${{ github.event.inputs.jitter && format('--jitter {0}', github.event.inputs.jitter) || '' }} \
            | tee bucket-${{ matrix.nodes }}.json
      - name: refuse a run that did not agree
        run: |
          python - <<'PY'
          import json, pathlib, sys
          got = json.loads(pathlib.Path("bucket-${{ matrix.nodes }}.json").read_text())
          # ASSERT ON THE CONDITION STRING FIRST. Rule 11b: the workflow says what
          # SHOULD have run and only the data says what did.
          print(got["condition"])
          if not got["agrees_with_one_process"] or got["mismatches"]:
              print(json.dumps(got["detail"], indent=1))
              sys.exit("containers disagreed with one process")
          if got["surfaces_checked"] < 2:
              sys.exit("nothing was checked, which is not a pass")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bucket-identity-${{ matrix.nodes }}
          path: bucket-${{ matrix.nodes }}.json
