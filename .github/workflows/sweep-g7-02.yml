name: sweep-g7-02-tiny-nodes-and-clusters

# How small can a node be, if a few of them may pool?
#
# Devices are pinned at ONE dimension each -- the smallest a device can be -- and
# the question is what cluster size is needed, with and without selective storage.
#
# Cluster size is a read-time choice, so one trained model is evaluated at every
# cluster size. That collapses a 256-cell grid into 32 jobs and removes a
# confound: every cluster size in a row shares the identical trained model, so
# differences between them cannot be training noise.
#
# Costed: 1.1 hours serial, worst job 12.8 minutes.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweeps
  cancel-in-progress: false

jobs:
  clusters:
    strategy:
      fail-fast: false
      matrix:
        seqlen: [96, 192, 288, 384]
        mode: [open, gated]
        lr: ["0.02", "0.05", "0.1", "0.2"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: seq ${{ matrix.seqlen }} ${{ matrix.mode }} lr ${{ matrix.lr }}
        run: python experiments/g7_02_clusters.py --seqlen ${{ matrix.seqlen }} --mode ${{ matrix.mode }} --lr ${{ matrix.lr }} --json out/C-${{ matrix.seqlen }}-${{ matrix.mode }}-${{ matrix.lr }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g7-02-${{ matrix.seqlen }}-${{ matrix.mode }}-${{ matrix.lr }}
          path: out/*.json

  aggregate:
    needs: [clusters]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g7-02-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 32" | tee summary.txt
          python tools/summarise_g7_02.py | tee -a summary.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g7-02-summary
          path: |
            summary.txt
            out/*.json
