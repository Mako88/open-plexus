name: sweep-g8-02-when-the-statistics-are-real

# Does a gate work once the filler statistics stop being adversarial?
#
# g8-01 measured both implementable gates recovering NOTHING of the oracle's
# advantage -- best cell 0.05, seven of twelve negative. Note 013 blames a base
# rate that only MQAR has: filler is 92% of the sequence and, being uniform, is
# also the most surprising content in it. That diagnosis has never been tested,
# and it is the difference between "surprise-driven storage does not work" and
# "surprise-driven storage does not work on this benchmark".
#
# Only the filler distribution changes. Values stay uniform, so the trivial floor
# and every baseline built on it remain valid.
#
# PRE-DISPATCH CONTROL RAN and confirmed the precondition: filler
# self-information falls from 3.485 to 1.707 as the exponent rises, while the
# answer alphabet is untouched at 5.938. The gap widens 72%. The control also
# disqualified one of its own columns -- firing rates measured against a bar that
# moves with the distribution are not comparable across rows, so its apparent
# "24x enrichment" is an artefact and is not a finding.
#
# 15 jobs. Costed from g8-01's measured control at 8.1 min per (cell, seed) with
# four arms: about 24 minutes per job serial, ~6 hours serial total. Each job runs
# its three seeds across 3 worker processes, so expect closer to 9 minutes.
# `nproc` is echoed because the worker count is a guess about runner cores that
# has never been checked.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweeps
  cancel-in-progress: false

jobs:
  statistics:
    strategy:
      fail-fast: false
      matrix:
        scale: ["0.0", "0.5", "1.0", "1.5", "2.0"]
        lr: ["0.02", "0.05", "0.1"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: How many cores does this runner actually have
        run: nproc
      - name: zipf ${{ matrix.scale }} lr ${{ matrix.lr }}
        run: python experiments/g8_02_zipf_gate.py --scale ${{ matrix.scale }} --lr ${{ matrix.lr }} --workers 3 --json out/X-${{ matrix.scale }}-${{ matrix.lr }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g8-02-${{ matrix.scale }}-${{ matrix.lr }}
          path: out/*.json

  aggregate:
    needs: [statistics]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g8-02-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 15" | tee summary.txt
          python -m tools.summarise_g8_02 | tee -a summary.txt
      - name: Summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: g8-02-summary
          path: |
            summary.txt
            out/*.json
