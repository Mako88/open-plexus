name: sweep-g13-05-does-the-gate-pay

# DOES GATING SEARCH ON AMBIGUITY BEAT SEARCHING EVERYWHERE?
#
# g13-03 measured search as a wash overall -- +0.008 +/-0.018 against a greedy
# walk -- while gaining +0.092 where the queried subject holds several relations
# and losing 0.054 where it holds one. g13-04 measured the decode margin
# separating those cases at AUC 0.803 at width >= 128, and the rival endpoint
# margin BELOW CHANCE.
#
# THE THRESHOLD IS THE HONEST PROBLEM. AUC measures separability across ALL
# thresholds; a gate needs ONE, and choosing it by trying values on the test set
# would be fitting a number rather than measuring one. Here it is a QUANTILE OF
# THE TRAINING MARGINS, computed after training and before any test sequence is
# touched, using no labels -- it asks only how wide a typical margin is for this
# model. The quantile is the swept axis so the sensitivity is visible.
#
# THE NUMBER TO BEAT IS search4, NOT walk. A gate that merely matches
# search-everywhere has bought compute savings and no accuracy.
#
# PREDICTIONS (full text in the script and the sweep file):
#   P1  at least one gate arm beats search4          <- THE DECISION
#   P2  every gate arm beats walk
#   P3  the best gate fires on under half the positions
#   P4  firing rate rises with the quantile          <- THE RAIL
#   P5  the gain over search4 is under 0.03, the perfect-gate figure
#
# WIDTH 256, where g13-04 measured the signal at AUC 0.858. It is weak at 64 and
# that is a scale property, registered in docs/SCALE.md.
#
# COST from the dearest arm (search4, which walks four branches at every
# answerable position; the gate arms are strictly cheaper): 5 arms per job,
# ~3 min per job. 8 jobs.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweep
  cancel-in-progress: false

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - name: seed ${{ matrix.seed }}, five arms at width 256
        run: |
          set -o pipefail
          mkdir -p out
          python experiments/g13_05_does_the_gate_pay.py \
            --seed ${{ matrix.seed }} --json out/seed-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g13-05-seed-${{ matrix.seed }}
          path: out/*.json

  aggregate:
    needs: [gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: g13-05-seed-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "seeds returned: $(ls out/*.json 2>/dev/null | wc -l) of 8" | tee summary.txt
          python -m tools.summarise_g13_05 | tee -a summary.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g13-05-summary
          path: |
            summary.txt
            out/*.json
