name: sweep-g21-01-does-the-beam-pay-in-run

# WIRING `beam` INTO `run()`, MEASURED RATHER THAN SWITCHED ON.
#
# `run()` has called `search` since decision 123 and has never called `beam` --
# the mechanism note 064 built and note 065 measured as the largest single gain
# in the project.
#
# THE NUMBER USUALLY QUOTED FOR THE TWO IS NOT EVIDENCE ABOUT THIS WIRING.
# 0.6588 against 0.8877 is CLUTRR chain recovery at chain lengths 2 to 10.
# `run()`'s task is kinship, its depth is hops=2, and it is scored on the
# readout's answer. Note 064's own diagnosis says why the depth matters: the
# relation decode is 0.974 at the root and ~0.91 mid-chain, and `search` hedges
# at the root while committing after. At hops=2 there is ONE mid-chain decode to
# get wrong, so most of the room the beam exploits is absent by construction.
#
# THE CONTROL IS `walk` (search_branches=1). Without it a gain could be credited
# to the beam when branching of any kind supplied all of it.
#
# `beam4-k2` is here because the rendezvous is a DISTRIBUTION cost, not a search
# parameter: ranking all `width` partial walks against each other is the round
# trip that keeps a driver-free walk outside d_max past depth 7 (note 101). Note
# 102 measured the meeting as worth 0.089 chain recovery and its PERIOD as worth
# nothing measurable. If that does not transfer to the end task, the distribution
# conclusion needs revisiting -- so it is measured, not assumed.
#
# PREDICTIONS (full text in the script and the summariser):
#   GATE   beam4 beats search4 by >= 0.01   <- the decision
#   RAIL   beam4 beats walk by > 0.05       <- the wiring is live at all
#   FALS   beam4-k2 within 0.02 of beam4    <- note 102 transfers
#
# WIDTH IS FIXED AT 256, matched to g13-03 so the `search4` column is comparable
# to a measurement already in the tree rather than a fresh baseline.
#
# COST, from the MOST EXPENSIVE arm (beam4-k2 -- skipping a rendezvous leaves the
# population uncapped between meetings, so the beam grows by `branches` per
# unpruned hop): --cost measured 21.5 ms per training sequence, 0.6 min per cell,
# ~2 min per job if every arm were the dear one. 8 jobs.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweep
  cancel-in-progress: false

jobs:
  beam:
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - name: seed ${{ matrix.seed }}, four arms at width 256
        run: |
          set -o pipefail
          mkdir -p out
          python experiments/g21_01_does_the_beam_pay_in_run.py \
            --seed ${{ matrix.seed }} --json out/seed-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g21-01-seed-${{ matrix.seed }}
          path: out/*.json

  aggregate:
    needs: [beam]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numpy
        run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: g21-01-seed-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "seeds returned: $(ls out/*.json 2>/dev/null | wc -l) of 8" | tee summary.txt
          python -m tools.summarise_g21_01 | tee -a summary.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g21-01-summary
          path: |
            summary.txt
            out/*.json
