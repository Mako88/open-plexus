name: sweep-g11-08-the-last-four-against-a-composed-readout

# THE REMAINING FOUR, re-checked against a composed readout.
#
# g11-07 re-checked four mechanisms and TWO OF THE TWO REFUTED ONES MOVED: pair
# keys recovered 60-80% of their penalty, and settling went from costing
# 0.13-0.16 bits to gaining 0.01-0.06. Two of two is not a reassuring base rate,
# and decision 77 named the four still unchecked. These are those.
#
# `orthogonal_every` is NOT here and cannot be, without implementing it: the
# model refuses it alongside a hidden layer because it orthogonalises an update
# whose shape is defined by the LINEAR readout. That refusal is also why it is
# now the most interesting of the four -- Boeshertz applied Muon PER LAYER in a
# deep network, and with one linear map there was nothing to orthogonalise per
# layer. Recorded in BACKLOG; implementing it is a change, not a re-check.
#
# PREDICTIONS, and they are WEAKER than g11-07's, which had a mechanism-specific
# reason to expect recovery. Here the reasoning is generic, so a confirmation is
# worth less than a refutation.
#   P1  identity: write=plain,readout=linear lands at 5.525
#   P2  the readout still dominates, every hidden128 cell beating its linear one
#   P3  the write gate's effect SHRINKS under a composed readout
#   P4  consolidation does NOT recover -- it is a claim about RETENTION, not
#       about information a linear map could not read
#   P5  readout bias still fails, and near zero rather than negative under
#       hidden128, since a hidden layer can already represent a constant
#
# P4 would teach the most if refuted: it would mean a mechanism named for
# retention is doing something to representation, and nothing in the record
# would have said so.
#
# COST: 12 jobs, 3 write x 4 readout, two seeds on two workers. g11-07's cells at
# these settings ran 18-45 s locally; at the 7.6x local-to-runner factor MEASURED
# on g11-06 the worst is ~6 min against a 300-minute timeout, and the matrix is
# ~12 minutes of local-equivalent job time.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweeps
  cancel-in-progress: false

jobs:
  mechanisms:
    strategy:
      fail-fast: false
      matrix:
        write: [plain, gated, corrective, consolidating]
        readout: [linear, hidden128, bias, hidden128+bias]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: ${{ matrix.write }} / ${{ matrix.readout }}
        run: python experiments/g11_04_scaling_exponent.py --corpus shakespeare --width 64 --chars 60000 --scale 128 --workers 2 --components "write=${{ matrix.write }},readout=${{ matrix.readout }}" --json out/X-${{ matrix.write }}-${{ matrix.readout }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g11-08-${{ matrix.write }}-${{ matrix.readout }}
          path: out/*.json

  aggregate:
    needs: [mechanisms]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: g11-08-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 16" | tee summary.txt
          python -m tools.summarise_components | tee -a summary.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g11-08-summary
          path: |
            summary.txt
            out/*.json
