name: sweep-g9-11-how-far-should-the-union-reach

# g9-10 found the combined gate scoring +0.26 at slots 4 where the tag alone
# scores -0.02 -- the highest tag-family recovery anywhere here. REWARD_WINDOW is
# frozen at 8 in that cell and in every combined cell ever run. This sweeps it.
#
# A counting control says the union is dominated by that reach:
#
#   delay 8    window alone 0.112   combined 1/2/4/8: 0.109 0.108 0.106 0.096
#   delay 20   window alone 0.000   tag 8 alone 0.008   combined 8: 0.003
#
# AND THAT CONTROL CANNOT SETTLE THIS, which is why the sweep exists. It ranks
# window-alone above combined at delay 8 where g9-10 measured the reverse, so
# whatever the union adds is in WHICH writes it keeps rather than how many, and a
# count is blind to it.
#
# Two wiring checks are free here: reach 8 reproduces every earlier combined
# cell, and the `tag` arm never reads the reach so its row must be flat.
#
# Delay 1 is a control on note 027's leak, not evidence about short delays --
# the task has a trivial exact solution there.
#
# 15 jobs, six arms x three seeds x one rate = 18 cells a job at width 64.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweeps
  cancel-in-progress: false

jobs:
  reach:
    strategy:
      fail-fast: false
      matrix:
        window: [1, 2, 4, 8, 16]
        delay: [1, 8, 20]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: reach ${{ matrix.window }} delay ${{ matrix.delay }}
        run: python experiments/g9_05_the_tag.py --width 64 --slots 4 --fade 0.95 --window ${{ matrix.window }} --scale ${{ matrix.delay }} --lr 0.05 --workers 3 --json out/X-${{ matrix.window }}-${{ matrix.delay }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g9-11-${{ matrix.window }}-${{ matrix.delay }}
          path: out/*.json

  aggregate:
    needs: [reach]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g9-11-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 15" | tee summary.txt
          python -m tools.summarise_g9_11 | tee -a summary.txt
      - name: Summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: g9-11-summary
          path: |
            summary.txt
            out/*.json
