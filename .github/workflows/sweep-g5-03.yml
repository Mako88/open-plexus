name: sweep-g5-03-a-finer-ruler

# How fast does the minimum machine size grow? With a ruler fine enough to say.
#
# g5-02 held total width at 256, whose only divisors in the interesting range are
# 8/16/32/64 -- factor-of-two steps measuring a quantity that moves by about a
# factor of two, giving 0.50 +/- 0.50. The coarse grid was forced by picking a
# power of two for the total, which looked like a neutral default.
#
# 240 has divisors 6/8/10/12/15/16/20/24/30/40, worst step 1.33x. Adding seq_len
# 48 stretches the span from 4x to 8x, which sharpens the exponent as much again
# and is the cheapest row rather than the dearest. Together: +/-0.14.
#
# 220 jobs, under GitHub's 256-job matrix cap. Costed before dispatch: 20.7 hours
# serial, worst job 12 minutes, about an hour of wall clock.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweeps
  cancel-in-progress: false

jobs:
  ruler:
    strategy:
      fail-fast: false
      matrix:
        seqlen: [48, 96, 192, 384]
        partitions: [1, 6, 8, 10, 12, 15, 16, 20, 24, 30, 40]
        lr: ["0.01", "0.02", "0.05", "0.1", "0.2"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: seq ${{ matrix.seqlen }} P ${{ matrix.partitions }} lr ${{ matrix.lr }}
        run: python experiments/g5_03_finer.py --seqlen ${{ matrix.seqlen }} --partitions ${{ matrix.partitions }} --lr ${{ matrix.lr }} --json out/R-${{ matrix.seqlen }}-${{ matrix.partitions }}-${{ matrix.lr }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g5-03-${{ matrix.seqlen }}-${{ matrix.partitions }}-${{ matrix.lr }}
          path: out/*.json

  aggregate:
    needs: [ruler]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g5-03-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 220" | tee summary.txt
          python tools/summarise_g5_02.py | tee -a summary.txt
      - name: Summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: g5-03-summary
          path: |
            summary.txt
            out/*.json
