name: sweep-g12-02-churn-over-a-real-network

# C3 IS THE LEAST-TESTED CONSTRAINT IN THE PROJECT, and this is its first real
# test. GOALS.md says departure "has never been tested in the predecessor
# project, because nothing ever left", and note 014 says the same of this one:
# "Churn is untested here. `absent` and `leave_at` work in-process, and the
# slice handshake that makes them mean anything under a real network was only
# just built."
#
# A four-node case was run by hand on 2026-07-28 and the property held. One run
# of one departure is not a measurement.
#
# THE ASSERTION IS NOT "AGREES". A run with a departure should NOT agree with the
# single-process model -- losing a quarter of the store's dimensions should
# change later answers. It is required not to diverge EARLY:
#
#     mismatches_before_departure == 0
#
# A machine switching off may change what happens next. It must not change what
# already happened. Asserting overall agreement would fail on correct behaviour,
# and a test that has to be ignored is a test that gets deleted.
#
# PREDICTIONS (full text in the sweep file):
#   P1  no early divergence anywhere -- the C3 property, one cell refutes it
#   P2  mismatches after departure rise with the fraction lost
#   P3  a later departure costs fewer mismatches, fewer steps left to be wrong in
#   P4  the remainder keeps running in every cell, no hang
#
# P4 is the one that would be embarrassing: a hang is exactly what a barrier
# looks like when a participant vanishes, and the absence of barriers is what C1
# is for.
#
# CLEAN LINK ON PURPOSE -- mixing impairment in would mean a divergence could be
# either departure or loss. Churn under impairment comes after both, if both
# hold.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-testbed
  cancel-in-progress: false

jobs:
  churn:
    strategy:
      fail-fast: false
      matrix:
        nodes: [4, 8, 16]
        lost: [one, quarter]
        leave_at: [10, 20, 30]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ${{ matrix.nodes }} nodes, ${{ matrix.lost }} leaving at step ${{ matrix.leave_at }}
        run: |
          set -o pipefail
          mkdir -p out
          # `one` removes node 0; `quarter` removes the first quarter BY INDEX,
          # which the slice handshake makes meaningful -- before it the driver
          # indexed by arrival order and would have removed whichever node the
          # network happened to deliver first.
          if [ "${{ matrix.lost }}" = "one" ]; then
            ABSENT=0
          else
            ABSENT=$(python -c "print(','.join(str(i) for i in range(${{ matrix.nodes }} // 4)))")
          fi
          echo "removing node indices: $ABSENT"
          python testbed/run.py --nodes ${{ matrix.nodes }} --width 16 --steps 40 \
            --absent "$ABSENT" --leave-at ${{ matrix.leave_at }} \
            | tee out/X-n${{ matrix.nodes }}-${{ matrix.lost }}-at${{ matrix.leave_at }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g12-02-n${{ matrix.nodes }}-${{ matrix.lost }}-at${{ matrix.leave_at }}
          path: out/*.json

  aggregate:
    needs: [churn]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g12-02-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 18" | tee summary.txt
          python -m tools.summarise_g12_02 | tee -a summary.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g12-02-summary
          path: |
            summary.txt
            out/*.json
