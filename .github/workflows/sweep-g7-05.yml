name: sweep-g7-05-mixed-machines

# Does a weak machine drag down a strong one?
#
# Heterogeneity needs no new mechanism: nodes stay identical at one dimension each
# and machines differ in how many they host. Two-level pooling adds nothing, since
# addition is associative -- so what is tested is MEMBERSHIP, not hierarchy.
#
# If a weak machine hurts, open participation needs weighting or admission
# control, which is coordination, which is what this project exists to avoid.
#
# Sizes capped at 16 because a pre-dispatch control found ungated pooling
# saturates around 32 nodes -- adding a second strong machine made things worse --
# and membership cannot be measured above saturation.
#
# 8 jobs. Costed: 2.4 hours serial, worst job 18 minutes.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweeps
  cancel-in-progress: false

jobs:
  mixed:
    strategy:
      fail-fast: false
      matrix:
        mode: [open, gated]
        lr: ["0.02", "0.05", "0.1", "0.2"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: ${{ matrix.mode }} lr ${{ matrix.lr }}
        run: python experiments/g7_05_mixed.py --mode ${{ matrix.mode }} --lr ${{ matrix.lr }} --json out/M-${{ matrix.mode }}-${{ matrix.lr }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g7-05-${{ matrix.mode }}-${{ matrix.lr }}
          path: out/*.json

  aggregate:
    needs: [mixed]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g7-05-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 8" | tee summary.txt
          python tools/summarise_g7_05.py | tee -a summary.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g7-05-summary
          path: |
            summary.txt
            out/*.json
