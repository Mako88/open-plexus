name: sweep-g12-04-what-is-the-round-trip

# EVERY WAITING PARAMETER IN THIS PROJECT IS TUNED IN STEPS, and a step has no
# fixed duration. Note 003 unified `d_max` as the C2 asynchrony bound and the C3
# churn timeout -- "two constraints, one parameter" -- and never measured it. C2
# says a design "must state a bound it tolerates"; a bound in steps is not one.
#
# Decision 127 read the SWIM paper and found the same quantity doing the same
# job, except measured: the indirect-probe timeout comes from the round-trip
# distribution (mean or p99) and the protocol period must be AT LEAST THREE
# TIMES the round-trip estimate.
#
# A MEAN CANNOT SIZE A TIMEOUT. In-process on loopback, with no impairment:
#   p50 0.38 ms   p99 24.19 ms   -- the tail is 64x the median on the easiest
# link available. A timeout set from the mean expires on healthy votes, which is
# the false-positive problem decision 126 reproduced independently by ejecting a
# node on its first missed send.
#
# PREDICTIONS (full text in the sweep file):
#   P1  p99 exceeds the mean by more than 2x at EVERY level, clean included
#   P2  the clean-link p99 is dominated by COMPUTE, not the link
#   P3  80 ms of delay moves the MEDIAN by roughly 80 ms
#   P4  jitter widens p50-to-p99 by more than delay alone does
#   P5  2% loss moves p99 far more than p50 -- a retransmit, not a delay
#   P6  T' >= 3 x p99 lands in the HUNDREDS of milliseconds on impaired links
#
# WINDOW 4, NOT 1. At window 1 the driver waits for every vote before sending the
# next token, so every round trip is serialised and the distribution measures
# lock-step rather than the link.
#
# COST: 6 cells on machinery g12-01 through g12-03 already ran at minutes each.
# Estimated from the dearest cell -- largest delay AND loss -- where 40 steps of
# 80 ms plus retransmits is link-dominated, so ~10 s of network per cell plus
# container start-up.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-testbed
  cancel-in-progress: false

jobs:
  roundtrip:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clean
            delay: ""
            jitter: ""
            loss: ""
          - name: delay-20
            delay: "20ms"
            jitter: ""
            loss: ""
          - name: delay-80
            delay: "80ms"
            jitter: ""
            loss: ""
          - name: delay-80-jitter-20
            delay: "80ms"
            jitter: "20ms"
            loss: ""
          - name: loss-2
            delay: ""
            jitter: ""
            loss: "2%"
          - name: delay-80-jitter-20-loss-2
            delay: "80ms"
            jitter: "20ms"
            loss: "2%"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ${{ matrix.name }}
        run: |
          set -o pipefail
          mkdir -p out
          ARGS="--nodes 4 --width 16 --steps 40 --window 4"
          if [ -n "${{ matrix.delay }}" ]; then ARGS="$ARGS --delay ${{ matrix.delay }}"; fi
          if [ -n "${{ matrix.jitter }}" ]; then ARGS="$ARGS --jitter ${{ matrix.jitter }}"; fi
          if [ -n "${{ matrix.loss }}" ]; then ARGS="$ARGS --loss ${{ matrix.loss }}"; fi
          echo "running: $ARGS"
          python testbed/run.py $ARGS | tee out/rtt-${{ matrix.name }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g12-04-${{ matrix.name }}
          path: out/*.json

  aggregate:
    needs: [roundtrip]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g12-04-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 6" | tee summary.txt
          python -m tools.summarise_g12_04 | tee -a summary.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g12-04-summary
          path: |
            summary.txt
            out/*.json
