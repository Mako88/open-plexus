# The suite, on every push and pull request.
#
# WHY THIS EXISTS: the suite passed six minutes locally and is still growing, so
# the feedback loop had started to cost real attention. Running it here does not
# make it faster -- it makes it somebody else's six minutes.
#
# THE SUITE IS SERIAL AND MUST STAY SERIAL. `Parallelism.cs` disables xUnit
# parallelisation as a MEASUREMENT decision, not a convenience: under load the
# ordering that produces the walk's disagreement with itself stops happening, so
# a parallel run scored the agreement perfect where a serial one did not. Do not
# add `-m` or `--parallel` here to save minutes. That would hide the class of
# defect this project keeps finding.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A RUNNING SUITE IS NEVER KILLED; A WAITING ONE IS REPLACED.
  #
  # This was `cancel-in-progress: true`, on the reasoning that nobody reads the
  # result of a commit that has already been replaced. TRUE OF THE COMMIT AND
  # FALSE OF THE RUN: with a suite this long and pushes landing faster than it
  # finishes, EVERY run got killed by the next one and the branch went hours
  # without a single complete result. That is how thirty-five failures sat unseen
  # through seven consecutive commits -- each push cancelled the run that would
  # have reported them.
  #
  # `false` gives what is actually wanted, because GitHub keeps at most ONE
  # pending run per group: the run in flight is left alone to finish and report,
  # a newly queued run waits behind it, and a THIRD arrival cancels the one still
  # waiting rather than the one working. So intermediate commits are skipped
  # without any finished work being thrown away, and whatever is newest when the
  # queue clears is what gets tested.
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # THE CORPORA ARE NOT IN THE REPOSITORY and are about six hundred megabytes,
      # so they are cached rather than fetched every run. Keyed on the fetch
      # script: it names the URLs and what is extracted, so a change to either
      # invalidates the cache, which is the only thing that should.
      #
      # AND THE PATH LIST WENT STALE WHEN TWO LARGE CORPORA WERE ADDED TO THE
      # SCRIPT AND NOT TO THIS. CIFAR-10 is 162 MB and the frozen encoders are
      # 352 MB, so every run re-fetched half a gigabyte while reporting a cache
      # hit on the four small ones. It was invisible until it was not: a run
      # spent 30m15s here and died with curl's exit 28, which is CIFAR's own
      # `--max-time 1800` elapsing against a slow academic host. The suite never
      # built.
      #
      # A CACHE THAT COVERS SOME OF WHAT IT IS FOR STILL READS AS A HIT, which is
      # this project's own trap wearing CI clothes -- the check ran, reported
      # success, and protected nothing that mattered.
      #
      # THE KEY CARRIES A VERSION BECAUSE THE HASH ALONE WOULD NOT REFRESH IT.
      # `fetch.sh` is unchanged, so the old key still matches and would restore
      # the four-path cache and never save the new paths.
      - name: Cache corpora
        id: corpora
        uses: actions/cache@v4
        with:
          path: |
            corpora/tasks_1-20_v1-2
            corpora/CLEVR_v1.0
            corpora/tatoeba_eng.tsv
            corpora/clutrr_test.csv
            corpora/cifar-10-batches-bin
            corpora/encoders
          key: corpora-v2-${{ hashFiles('corpora/fetch.sh') }}

      # NOT CONDITIONAL ON A CACHE HIT. The script already checks for what it
      # fetches and says "already at ..." -- so a partial cache repairs itself
      # instead of leaving a world to fail with a message about a missing file.
      - name: Fetch corpora
        run: bash corpora/fetch.sh

      # WARNINGS ARE PART OF THE CONTRACT HERE AND THE BUILD ENFORCES IT NOW.
      # `DocsTests` asserts the library builds with its documentation file on, and
      # the XML comments are where this project keeps what every piece does -- so
      # a warning about a missing `param` tag is a doc going stale, not noise.
      #
      # THIS WAS A SEPARATE STEP GREPPING FOR `warning (CS|xUnit)`, AND
      # `TreatWarningsAsErrors` KILLED IT WITHOUT ANYBODY NOTICING. The compiler
      # emits `error CS1574` now, so the grep matches nothing, so the step would
      # print "warning-clean" and pass -- on a build that had already failed above
      # it. A CHECK THAT CANNOT FIRE READS AS A PASS, which is this project's own
      # trap, reintroduced by the commit that closed it. Deleted rather than
      # repaired: the gate belongs in the build, where everybody runs it.
      - name: Build
        run: dotnet build --configuration Debug --nologo --no-incremental

      # QUIET IS FOR THE BUILD, AND THE CONSOLE LOGGER IS FOR THE RESULT. At
      # `--verbosity quiet` alone this step printed the NAME of every failing
      # test and the message of none of them, so the only way to learn why
      # anything failed was to reproduce it locally -- which is how a handoff
      # came to say "12 red, every one diagnosed" on a run that was 35 red. A
      # suite nobody can read the failure of is a suite that gets diagnosed by
      # sampling.
      # SWEEPS ARE EXCLUDED AND THEY ARE NOT TESTS. A fact marked `kind=sweep`
      # asserts nothing -- it prints a grid, because a threshold written before
      # the first run is a prediction dressed as a check. One session added
      # several hundred runs of twenty and thirty thousand rounds that way and
      # took the suite past the timeout above, which does not merely lose the
      # numbers: IT KILLS THE RUN THAT WOULD HAVE REPORTED THE REAL FAILURES,
      # and the note on `cancel-in-progress` is about exactly that outcome
      # arriving by a different road.
      #
      # `dotnet test --filter "kind=sweep"` takes the measurements again. They
      # are still compiled here, so a rotted reference still fails the build.
      - name: Test
        run: |
          dotnet test --configuration Debug --nologo --no-build \
            --filter "kind!=sweep" \
            --verbosity quiet --logger "console;verbosity=normal"
