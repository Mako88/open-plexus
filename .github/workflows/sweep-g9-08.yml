name: sweep-g9-08-how-small-a-node-can-run-the-gate

# Every cell in g9-02 through g9-07 is d_model 32 in one process, so the entire
# gating line -- including g9-06's flat-and-positive +0.16 -- is silent on node
# SIZE, which is what this project is about.
#
# g7-02 answered it for the ORACLE gate: devices holding one number each scored
# identically to three decimals across four sequence lengths, and g7-03 found the
# allocation decision stops mattering. Both are ceilings. Nobody has asked it of
# a gate a node could actually run.
#
# Note 024 costs the gate and finds it affordable at width 1 -- 320 numbers
# against a 256-number store. Cost is not gain.
#
# slots 32 and fade 0.95 are FROZEN at g9-06's working point, which was chosen at
# width 32. If the best capacity moves with width this measures a mistuned tag
# everywhere else and understates it; that is prediction 5 and it is named in the
# sweep file rather than left as a silent assumption.
#
# 15 jobs of (width, delay). Five arms x three seeds x one rate = 15 cells a job;
# g9-05 costed the same shape at ~7 minutes at width 32, and width 64 is roughly
# four times a width-32 cell.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweeps
  cancel-in-progress: false

jobs:
  width:
    strategy:
      fail-fast: false
      matrix:
        width: [4, 8, 16, 32, 64]
        delay: [1, 8, 20]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: width ${{ matrix.width }} delay ${{ matrix.delay }}
        run: python experiments/g9_05_the_tag.py --width ${{ matrix.width }} --slots 32 --fade 0.95 --scale ${{ matrix.delay }} --lr 0.05 --workers 3 --json out/X-${{ matrix.width }}-${{ matrix.delay }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g9-08-${{ matrix.width }}-${{ matrix.delay }}
          path: out/*.json

  aggregate:
    needs: [width]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g9-08-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 15" | tee summary.txt
          python -m tools.summarise_g9_08 | tee -a summary.txt
      - name: Summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: g9-08-summary
          path: |
            summary.txt
            out/*.json
