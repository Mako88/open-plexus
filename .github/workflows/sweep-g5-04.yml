name: sweep-g5-04-how-far-does-pooling-stretch

# g5-03 located the `alone` floor everywhere and fitted seq_len^0.67, but found
# the POOLED floor below its smallest machine at three of four lengths -- a bound,
# not a measurement. This extends the grid down to machine width 3 to find where
# pooling actually breaks, and whether it holds up as problems grow or merely
# starts from a better place.
#
# Same script as g5-03; the grid is pinned here, so g5-03 reproduces unchanged.
# 240 jobs, under GitHub's 256-job matrix cap. Costed: ~22 hours serial, worst
# job ~12 minutes, about an hour of wall clock.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweeps
  cancel-in-progress: false

jobs:
  pooling:
    strategy:
      fail-fast: false
      matrix:
        seqlen: [96, 128, 192, 256, 384]
        partitions: [240, 120, 60, 40, 30, 24, 20, 16, 12, 10, 8, 6]
        lr: ["0.02", "0.05", "0.1", "0.2"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: seq ${{ matrix.seqlen }} P ${{ matrix.partitions }} lr ${{ matrix.lr }}
        run: python experiments/g5_03_finer.py --seqlen ${{ matrix.seqlen }} --partitions ${{ matrix.partitions }} --lr ${{ matrix.lr }} --json out/S-${{ matrix.seqlen }}-${{ matrix.partitions }}-${{ matrix.lr }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g5-04-${{ matrix.seqlen }}-${{ matrix.partitions }}-${{ matrix.lr }}
          path: out/*.json

  aggregate:
    needs: [pooling]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g5-04-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 240" | tee summary.txt
          python tools/summarise_g5_02.py | tee -a summary.txt
      - name: Summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: g5-04-summary
          path: |
            summary.txt
            out/*.json
