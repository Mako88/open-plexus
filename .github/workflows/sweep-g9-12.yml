name: sweep-g9-12-what-does-the-frozen-learning-rate-cost

# `lr 0.05, FIXED on every arm` appears in the grid of g9-05 through g9-11 --
# every sweep in the line. It was chosen for g9-03's workflow at d_model 32 in
# one process and carried through every change of width, node count, capacity,
# fade and reach since. Note 028.
#
# g8-01 measured the rate moving the FLOOR arm -- the denominator of every
# recovery ratio -- by a factor of three. And g9-11 measured what ONE carried
# constant costs when wrong: 0.58 of recovery, more than twice the largest effect
# any mechanism in this line has produced.
#
# THE COST IS UNUSUALLY LOW. g9_05_the_tag.py sweeps LEARNING_RATES =
# (0.02, 0.05, 0.1) inside a job whenever --lr is omitted, so dropping the flag
# triples the compute per job and adds NO JOBS.
#
# delay 8 only, because slots 16 is correct at delay 8 and not at delay 20
# (g9-10: 32 is best there). Running delay 20 would measure a mistuned capacity
# and confound the question. `fade` 0.95 is still carried from d_model 32 and is
# named in the sweep file rather than hidden.
#
# 4 jobs, 54 cells each, against a 90-minute timeout.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweeps
  cancel-in-progress: false

jobs:
  rate:
    strategy:
      fail-fast: false
      matrix:
        partitions: [1, 2, 4, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: node ${{ 64 }}/${{ matrix.partitions }}, rate swept
        run: python experiments/g9_05_the_tag.py --width 64 --partitions ${{ matrix.partitions }} --slots 16 --fade 0.95 --window 8 --scale 8 --workers 3 --json out/X-${{ matrix.partitions }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g9-12-${{ matrix.partitions }}
          path: out/*.json

  aggregate:
    needs: [rate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g9-12-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 4" | tee summary.txt
          python -m tools.summarise_g9_12 | tee -a summary.txt
      - name: Summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: g9-12-summary
          path: |
            summary.txt
            out/*.json
