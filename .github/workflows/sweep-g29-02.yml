name: sweep-g29-02-concept-partitioning-at-equal-state

# g29-01 gave the concept arm 7.7x the STATE and it won. That is not evidence about
# the arrangement, and the confound was already written down in two places before
# g29-01 was dispatched:
#
#   local_memory.py, at the knob:  each node keeps a FULL d x d store, so the
#   comparison at equal d_model is "biased TOWARD partitioning", and a win "would
#   need the g10-09 equal-state treatment before it meant anything".
#
#   tests/test_concept_routing.py: "the apparent gain is the extra state, not the
#   arrangement" -- 16 nodes of width 32 score 0.988 where a monolithic store with
#   the same number count scores 1.000.
#
# MEASURED on a model that has actually run a 384-token sequence, because
# ConceptStore allocates lazily and a freshly constructed model reports 81,984 for
# every arrangement -- a count taken at construction would have shown no confound:
#
#   dimension, 16 groups at width 256      147,520 numbers   1.00x
#   concept,   16 nodes  at width  64       88,128 numbers   0.60x
#   concept,   16 nodes  at width 256    1,132,608 numbers   7.68x  (g29-01)
#
# So the concept arm runs at width 64 here and is DISADVANTAGED on state. A win
# under that cannot be bought, which is the whole point; matching exactly would
# need width ~85 and an interpolation nobody would trust.
#
# The dimension arm is re-run rather than quoted, same as g29-01, so the comparison
# stays paired on one runner.
#
# COST: g29-01's concept cells took 47-53 minutes at width 256 against the dimension
# cells' 26-30. Width 64 should be cheaper; timeout-minutes 180 is kept unchanged
# because a timeout costs a whole matrix and headroom is free.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweep
  cancel-in-progress: false

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        split: [dimension, concept]
        lr: ["0.01", "0.02", "0.05", "0.1", "0.2"]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: ${{ matrix.split }} lr ${{ matrix.lr }} at seq 384, EQUAL STATE
        run: |
          set -o pipefail
          mkdir -p out
          if [ "${{ matrix.split }}" = "concept" ]; then MODE="--mode concept"; W=64; else MODE=""; W=256; fi
          python experiments/g5_01_scaling.py $MODE \
            --width $W --seqlen 384 --lr ${{ matrix.lr }} \
            --json out/G-${{ matrix.split }}-${{ matrix.lr }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g29-02-${{ matrix.split }}-${{ matrix.lr }}
          path: out/*.json

  aggregate:
    needs: [gate]
    # A matrix that loses cells still reports, and says how many it lost.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: g29-02-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 10" \
            | tee summary.txt
          python - <<'EOF' | tee -a summary.txt
          import glob, json
          rows = [r for p in sorted(glob.glob("out/*.json"))
                  for r in json.load(open(p))]
          best = {}
          for r in rows:
              # BEST over learning rates, per arm, at the final checkpoint --
              # g5-01's own convention, so the 0.769 it reports is comparable.
              if r["epoch"] != max(x["epoch"] for x in rows):
                  continue
              key = r.get("split", "dimension")
              if key not in best or r["pooled"] > best[key][0]:
                  best[key] = (r["pooled"], r["lr"])
          print(f"\n{'arm':<12}{'best pooled':>13}{'at lr':>8}{'spread over lr':>16}")
          for k in sorted(best):
              # SPREAD is P3's instrument. g29-01's concept arm returned 1.0000 in
              # thirty cells of thirty -- zero spread -- so it could not have ranked
              # a learning rate had one mattered. A saturated grid reports a
              # ceiling, not a result, and printing the spread makes that visible
              # in the summary instead of only in the artifacts.
              scores = [r["pooled"] for r in rows
                        if r["epoch"] == max(x["epoch"] for x in rows)
                        and r.get("split", "dimension") == k]
              print(f"{k:<12}{best[k][0]:>13.4f}{best[k][1]:>8}"
                    f"{max(scores) - min(scores):>16.4f}")
          print("\n  CONCEPT ran at width 64 (88,128 numbers), DIMENSION at 256")
          print("  (147,520), so concept holds 0.60x the state and a win here")
          print("  cannot be bought with memory the way g29-01's could.")
          print("  P1: concept still solves this cell, pooled above 0.95.")
          print("  P2: concept beats the dimension arm's 0.755 regardless.")
          print("  P3: concept is NOT saturated -- a spread of 0.0000 means this")
          print("      cell is a ceiling and the next run must go to longer seqs.")
          EOF
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g29-02-summary
          path: |
            summary.txt
            out/*.json
