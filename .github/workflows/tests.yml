# The guards, on every push. Seconds, and they are the only thing CI runs.
#
# WHY THIS IS SO MUCH SMALLER THAN THE ONE IT REPLACES. The `commitments` branch
# ran a sharded six-minute C# suite here and needed six hundred megabytes of
# cached corpora to do it. This branch's fast tests take three seconds and need
# no data, because everything expensive is either an EXAM -- dispatched by hand,
# on a GPU, never under pytest -- or a reading that is already committed as JSON.
#
# CI IS NOT A GATE ON PUSHING and the culture note says so. Push whenever; put
# `[checkpoint]` in the message on a state worth returning to.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A RUNNING SUITE IS NEVER KILLED; A WAITING ONE IS REPLACED. Carried over
  # from the branch before, where `cancel-in-progress: true` meant every run got
  # killed by the next push and thirty-five failures sat unseen through seven
  # commits. A commit marked `[checkpoint]` gets its own group, so it queues
  # behind nothing and nothing cancels it.
  group: tests-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[checkpoint]') && github.sha || 'rolling' }}
  cancel-in-progress: false

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # THE RUNNER HAS NO NVIDIA CARD, AND THE PIN IS STILL WHAT IS BEING
      # CHECKED. `test_toolchain.py` asserts `sm_61` is in
      # `torch.cuda.get_arch_list()`, which is a property of the WHEEL and not of
      # the machine -- a cu128 wheel fails that check on a runner with no GPU at
      # all, which is exactly the regression worth catching here. The tests that
      # need a device skip themselves.
      - name: Install
        run: uv sync --frozen

      - name: Guards
        run: uv run pytest tests/guards

      # THE RED SET IS RUN AND NOT ENFORCED. `tests/outstanding` is expected to
      # fail -- it is how an unfinished intent survives a session. Printing it
      # here means the list of what is owed arrives with every run instead of
      # living in somebody's head. `|| true` because red is the correct state.
      - name: The red set (expected to fail; printed, not enforced)
        run: uv run pytest tests/outstanding --no-header -rf || true
