# The suite, on every push and pull request.
#
# WHY THIS EXISTS: the suite passed six minutes locally and is still growing, so
# the feedback loop had started to cost real attention. Running it here does not
# make it faster -- it makes it somebody else's six minutes.
#
# THE SUITE IS SERIAL AND MUST STAY SERIAL. `Parallelism.cs` disables xUnit
# parallelisation as a MEASUREMENT decision, not a convenience: under load the
# ordering that produces the walk's disagreement with itself stops happening, so
# a parallel run scored the agreement perfect where a serial one did not. Do not
# add `-m` or `--parallel` here to save minutes. That would hide the class of
# defect this project keeps finding.
#
# SHARDING ACROSS RUNNERS IS THE ONE THING THAT IS NOT THAT, and it is how the wall
# clock comes down instead. The rule is about how busy ONE MACHINE is while it
# measures; four runners each executing their own tests one at a time are four serial
# runs at the load profile a serial run has. Nothing overlaps that could have seen
# anything else overlap.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A RUNNING SUITE IS NEVER KILLED; A WAITING ONE IS REPLACED.
  #
  # This was `cancel-in-progress: true`, on the reasoning that nobody reads the
  # result of a commit that has already been replaced. TRUE OF THE COMMIT AND
  # FALSE OF THE RUN: with a suite this long and pushes landing faster than it
  # finishes, EVERY run got killed by the next one and the branch went hours
  # without a single complete result. That is how thirty-five failures sat unseen
  # through seven consecutive commits -- each push cancelled the run that would
  # have reported them.
  #
  # `false` gives what is actually wanted, because GitHub keeps at most ONE
  # pending run per group: the run in flight is left alone to finish and report,
  # a newly queued run waits behind it, and a THIRD arrival cancels the one still
  # waiting rather than the one working. So intermediate commits are skipped
  # without any finished work being thrown away, and whatever is newest when the
  # queue clears is what gets tested.
  # AND A COMMIT CAN OPT OUT OF BEING SKIPPED, WHICH IS WHAT MAKES PUSHING FREE.
  # The behaviour above is right for a branch being pushed to steadily and wrong
  # for the one commit somebody actually wants a verdict on -- a checkpoint before
  # a default changes, a state worth returning to. Put `[checkpoint]` in the commit
  # message and the group becomes unique to that SHA, so it queues behind nothing,
  # cancels nothing, and nothing cancels it. Everything else keeps rolling.
  #
  # SO THE RULE IS: PUSH WHENEVER, AND MARK THE ONES THAT MUST CLEAR. Waiting for a
  # suite before pushing buys nothing this already gives -- the newest commit is
  # what gets tested when the queue clears, and a marked one is tested regardless.
  group: tests-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[checkpoint]') && github.sha || 'rolling' }}
  cancel-in-progress: false
jobs:
  # THE CORPORA ARE FETCHED ONCE AND NOT ONCE PER SHARD, WHICH IS WHY THIS IS ITS OWN
  # JOB. `cs.toronto.edu` serves CIFAR at about 106 kB/s and the payload is six hundred
  # megabytes; four runners each pulling that on a cold cache is four times the load on a
  # slow academic host for one copy of the same bytes, and the run that died on curl's
  # exit 28 is what that looks like when it goes wrong.
  #
  # THE SHARDS RESTORE AND NEVER FETCH. If this saved, they hit; if it failed, they do
  # not run at all -- a shard quietly re-fetching would put the four-way download back
  # with nobody noticing it had returned.
  corpora:
    runs-on: ubuntu-latest
    # NINETY, AND MOST OF IT IS FOR A COLD CACHE RATHER THAN FOR THE SUITE.
    #
    # It was 45, which was comfortable for the tests and is not comfortable for
    # the fetch: `cs.toronto.edu` serves CIFAR at about 106 kB/s, so 162 MB is
    # twenty-five minutes on its own, and a cache miss pays that plus half a
    # gigabyte of everything else before a single test runs.
    #
    # A COLD CACHE IS RARE AND THE KEY SAYS WHEN. It misses only when
    # `corpora/fetch.sh` changes, so this budget is spent about as often as that
    # file is edited; every other run restores and skips the download entirely.
    #
    # AND THE SUITE ITSELF GOT SHORTER IN THE SAME BREATH, since the measurement
    # sweeps are filtered out below. This is not room for the tests to sprawl
    # into -- if the TEST step starts approaching this, that is a finding.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # THE CORPORA ARE NOT IN THE REPOSITORY and are about six hundred megabytes,
      # so they are cached rather than fetched every run. Keyed on the fetch
      # script: it names the URLs and what is extracted, so a change to either
      # invalidates the cache, which is the only thing that should.
      #
      # AND THE PATH LIST WENT STALE WHEN TWO LARGE CORPORA WERE ADDED TO THE
      # SCRIPT AND NOT TO THIS. CIFAR-10 is 162 MB and the frozen encoders are
      # 352 MB, so every run re-fetched half a gigabyte while reporting a cache
      # hit on the four small ones. It was invisible until it was not: a run
      # spent 30m15s here and died with curl's exit 28, which is CIFAR's own
      # `--max-time 1800` elapsing against a slow academic host. The suite never
      # built.
      #
      # A CACHE THAT COVERS SOME OF WHAT IT IS FOR STILL READS AS A HIT, which is
      # this project's own trap wearing CI clothes -- the check ran, reported
      # success, and protected nothing that mattered.
      #
      # THE KEY CARRIES A VERSION BECAUSE THE HASH ALONE WOULD NOT REFRESH IT.
      # `fetch.sh` is unchanged, so the old key still matches and would restore
      # the four-path cache and never save the new paths.
      # AND FIXING THE PATH LIST DID NOT FIX THE CACHE, WHICH IS THE SAME TRAP
      # ONE LAYER DOWN. `actions/cache` saves in a POST step, and it skips that
      # step entirely on an exact key hit -- there is nothing to save when the
      # key already matched. So the run that died mid-fetch saved the four
      # corpora it had managed, under the v2 key; every run after it restored
      # that partial payload, reported a HIT, re-fetched half a gigabyte, and
      # then declined to save it because the key had matched. A cache that can
      # never be repaired, keyed on a file that was not going to change again.
      #
      # SO THE SAVE IS ITS OWN STEP AND IT RUNS WHERE THE CONTENT IS COMPLETE:
      # after the fetch and before the tests, with no `always()` on it. A fetch
      # that fails takes the job down before this, which is what stops a partial
      # payload being written under a good key a second time -- and a test
      # failure no longer costs the download, which is what it cost every run
      # since the sweeps went in.
      - name: Restore corpora
        id: corpora
        uses: actions/cache/restore@v4
        with:
          path: |
            corpora/tasks_1-20_v1-2
            corpora/CLEVR_v1.0
            corpora/tatoeba_eng.tsv
            corpora/clutrr_test.csv
            corpora/cifar-10-batches-bin
            corpora/encoders
          key: corpora-v3-${{ hashFiles('corpora/fetch.sh') }}

      # THE ONE STEP IN `fetch.sh` THAT IS NOT A DOWNLOAD, AND IT HAS BEEN
      # SKIPPING HERE SINCE THE DAY IT WAS WRITTEN. MobileNet's published export
      # ends at a 1000-way classifier, and a front end may say what it is looking
      # at and never what to conclude -- so the graph is cut one `Gemm` early,
      # which needs `onnx`. The runner has no such package, the script says so
      # and carries on, and four `EncodedTests` have failed on the missing file
      # ever since. A DEPENDENCY THAT ANNOUNCES ITS OWN ABSENCE IS STILL AN
      # ABSENCE: the message went to a log nobody reads and the failure arrived
      # six minutes later wearing a different name.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the encoder surgery
        run: pip install --disable-pip-version-check onnx

      # NOT CONDITIONAL ON A CACHE HIT. The script already checks for what it
      # fetches and says "already at ..." -- so a partial cache repairs itself
      # instead of leaving a world to fail with a message about a missing file.
      - name: Fetch corpora
        run: bash corpora/fetch.sh

      # AND THE SAVE BELOW IS ONLY SAFE IF WHAT IT SAVES IS COMPLETE, so the one
      # thing `fetch.sh` is allowed to skip is asserted here rather than trusted.
      # The script warns and carries on by design -- a machine without `onnx` is
      # John's, and failing his fetch over a file only CI needs would be the
      # wrong trade. What must not happen is CI writing that gap into a cache
      # under a key that will match forever, which is the fault this whole block
      # is about.
      - name: The corpora are whole before they are cached
        run: |
          test -f corpora/encoders/mobilenetv3-small/model_headless.onnx \
            || { echo "the headless encoder was not cut -- see 'Install the encoder surgery'"; exit 1; }

      # WRITTEN OUT TWICE BECAUSE GITHUB ACTIONS DOES NOT READ YAML ANCHORS. An
      # `&corpora` above and a `*corpora` here is the obvious way to keep one
      # list, and it parses as a literal -- so the save would run against a path
      # that does not exist and report success. The clone budget's own reason for
      # existing, arriving somewhere it cannot be enforced.
      - name: Save corpora
        if: steps.corpora.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            corpora/tasks_1-20_v1-2
            corpora/CLEVR_v1.0
            corpora/tatoeba_eng.tsv
            corpora/clutrr_test.csv
            corpora/cifar-10-batches-bin
            corpora/encoders
          key: corpora-v3-${{ hashFiles('corpora/fetch.sh') }}

      # WARNINGS ARE PART OF THE CONTRACT HERE AND THE BUILD ENFORCES IT NOW.
      # `DocsTests` asserts the library builds with its documentation file on, and
      # the XML comments are where this project keeps what every piece does -- so
      # a warning about a missing `param` tag is a doc going stale, not noise.
      #
      # THIS WAS A SEPARATE STEP GREPPING FOR `warning (CS|xUnit)`, AND
      # `TreatWarningsAsErrors` KILLED IT WITHOUT ANYBODY NOTICING. The compiler
      # emits `error CS1574` now, so the grep matches nothing, so the step would
      # print "warning-clean" and pass -- on a build that had already failed above
      # it. A CHECK THAT CANNOT FIRE READS AS A PASS, which is this project's own
      # trap, reintroduced by the commit that closed it. Deleted rather than
      # repaired: the gate belongs in the build, where everybody runs it.

  # SHARDED ACROSS RUNNERS, AND THAT IS NOT THE PARALLELISM THE NOTE AT THE TOP FORBIDS.
  # `Parallelism.cs` serialises the assembly because numbers move with how busy the
  # MACHINE is -- the walk's agreement with itself reads 0.8833 alone and 1.0000 under
  # load, so a run overlapping its own tests scores the flattering number and the defect
  # goes invisible. Every shard below still runs its tests ONE AT A TIME, on its own
  # runner, at the load profile a whole serial run would have had. What is parallel is
  # the runners, and they cannot see each other.
  #
  # DO NOT ADD `-m` OR `--parallel` INSIDE A SHARD. That is the thing being avoided, and
  # it would stay avoided right up until somebody read this block as permission.
  #
  # THE LAST SHARD IS A NEGATIVE FILTER SO NOTHING CAN GO UNRUN. Four lists of classes
  # would mean a new test file landing in none of them and passing by being ABSENT,
  # which is this project's oldest failure wearing a build-config hat. The heavy classes
  # are named; the last shard is whatever is left, including every file nobody has
  # written yet.
  #
  # THE SPLIT IS BY MEASURED COST AND WILL GO STALE. Taken at 1,254s over 617 tests,
  # where the two walk worlds are a third of it between them. If one shard starts
  # dominating, re-cut it: an unbalanced split costs wall clock and nothing else, so
  # this is a tuning note rather than a correctness one.
  suite:
    needs: corpora
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      # ONE SHARD FAILING MUST NOT CANCEL THE OTHERS, for the reason the concurrency
      # block gives at length: a suite nobody gets a complete result from is a suite
      # diagnosed by sampling. Three shards reporting and one red is four pieces of
      # information; one red and three cancelled is one.
      fail-fast: false

      # THE SOCKET SUITES GOT A RUNNER OF THEIR OWN, AND FOR CONTENTION RATHER THAN FOR
      # LENGTH. `AskedTests`, `FleetTests` and `UnreachedTests` each bring up a fleet of real
      # listeners on real ports and run whole learners over them, so they are the three that
      # get slower beside each other -- and the three that were sitting in the catch-all
      # shard, which is the one that has been running past the timeout above while the other
      # three finish inside ten minutes.
      #
      # AND THE LIST IS CHECKED NOW, WHICH IS WHY MOVING ANYTHING IS SAFE. `ShardTests`
      # fails the build if a class lands in two shards or in none -- the second being the
      # one that costs nothing to make and reads as green forever. It also wants this to be
      # a contiguous block of entries, so a comment goes here rather than between them.
      matrix:
        shard:
          - "(FullyQualifiedName~BindingTests|FullyQualifiedName~ClevrTests)"
          - "(FullyQualifiedName~HomeostatTests|FullyQualifiedName~EncodedTests|FullyQualifiedName~RecalledTests)"
          - "(FullyQualifiedName~ArrangedTests|FullyQualifiedName~SensesTests|FullyQualifiedName~GradedTests|FullyQualifiedName~MotifTests|FullyQualifiedName~RhythmTests)"
          - "(FullyQualifiedName~AskedTests|FullyQualifiedName~FleetTests|FullyQualifiedName~UnreachedTests|FullyQualifiedName~SlotTests|FullyQualifiedName~PostedTests)"
          - "(FullyQualifiedName!~BindingTests&FullyQualifiedName!~ClevrTests&FullyQualifiedName!~HomeostatTests&FullyQualifiedName!~EncodedTests&FullyQualifiedName!~ArrangedTests&FullyQualifiedName!~SensesTests&FullyQualifiedName!~GradedTests&FullyQualifiedName!~MotifTests&FullyQualifiedName!~RhythmTests&FullyQualifiedName!~AskedTests&FullyQualifiedName!~FleetTests&FullyQualifiedName!~UnreachedTests&FullyQualifiedName!~SlotTests&FullyQualifiedName!~RecalledTests&FullyQualifiedName!~PostedTests)"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # RESTORE ONLY, AND IT MUST HIT. The `corpora` job above has already fetched and
      # saved under this exact key, so a miss here means that job's save did not happen
      # -- and the right answer to that is to fail loudly rather than to quietly fetch
      # six hundred megabytes on four runners at once.
      - name: Restore corpora
        id: corpora
        uses: actions/cache/restore@v4
        with:
          path: |
            corpora/tasks_1-20_v1-2
            corpora/CLEVR_v1.0
            corpora/tatoeba_eng.tsv
            corpora/clutrr_test.csv
            corpora/cifar-10-batches-bin
            corpora/encoders
          key: corpora-v3-${{ hashFiles('corpora/fetch.sh') }}

      - name: The corpora arrived
        run: |
          test -f corpora/encoders/mobilenetv3-small/model_headless.onnx             || { echo "corpora cache did not restore -- see the 'corpora' job"; exit 1; }

      - name: Build
        run: dotnet build --configuration Debug --nologo --no-incremental

      # QUIET IS FOR THE BUILD, AND THE CONSOLE LOGGER IS FOR THE RESULT. At
      # `--verbosity quiet` alone this step printed the NAME of every failing
      # test and the message of none of them, so the only way to learn why
      # anything failed was to reproduce it locally -- which is how a handoff
      # came to say "12 red, every one diagnosed" on a run that was 35 red. A
      # suite nobody can read the failure of is a suite that gets diagnosed by
      # sampling.
      # SWEEPS ARE EXCLUDED AND THEY ARE NOT TESTS. A fact marked `kind=sweep`
      # asserts nothing -- it prints a grid, because a threshold written before
      # the first run is a prediction dressed as a check. One session added
      # several hundred runs of twenty and thirty thousand rounds that way and
      # took the suite past the timeout above, which does not merely lose the
      # numbers: IT KILLS THE RUN THAT WOULD HAVE REPORTED THE REAL FAILURES,
      # and the note on `cancel-in-progress` is about exactly that outcome
      # arriving by a different road.
      #
      # `dotnet test --filter "kind=sweep"` takes the measurements again. They
      # are still compiled here, so a rotted reference still fails the build.
      - name: Test
        run: |
          dotnet test --configuration Debug --nologo --no-build \
            --filter "kind!=sweep&${{ matrix.shard }}" \
            --verbosity quiet --logger "console;verbosity=normal"
