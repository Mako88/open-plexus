name: sweep-g10-01-does-this-memory-beat-a-bigram

# The first time anything in this project sees language, and the first evidence
# either way for goal 2 -- a language model that does not need a data centre.
#
# The bar, measured on the actual corpus before this was written:
#   uniform 6.426   unigram 4.756   bigram 3.711   trigram 2.934 bits/char
#
# Bigram is the bar and it is the fair one: binding the previous token to the
# current one IS a bigram in vector form.
#
# The pre-dispatch control reached 5.891 bits/char calibrated at width 32,
# chunk 64 -- above uniform, well short of unigram. Predictions are registered
# knowing that, and say so.
#
# A temperature is fitted on held-out TRAINING chunks, never on test, because a
# delta-rule readout is discriminative and its scores are not on a softmax's
# scale. Both raw and calibrated numbers are reported.
#
# RE-RUN. The first attempt's chunk axis measured a DIVERGENCE: the fast store
# accumulates across a chunk, the delta rule feeds on the retrievals, and Wo
# reached 1e72 with next-character accuracy of 0.005 -- below the 1/86 chance
# rate. It reported 37 bits/char and NaN, over a vocabulary whose uniform cost is
# 6.426.
#
# `memory_cap` is synaptic scaling on the fast store. It DEFAULTS TO OFF and the
# first run never set it. With it, chunk 256 is stable and gives 5.72 bits.
#
# So `cap` is now an axis rather than a pinned constant: 1.0 and 5.0 already
# disagree by 0.13 bits, and freezing the value found in the one diverging cell
# is the frozen-constant mistake this project keeps catching.
#
# Chunk is fixed at 256 for this re-run -- the widest setting known to be stable
# -- because width is the axis that decides whether g10-02's underfitting is
# structural or width-limited, and that is the live question.
#
# 6 jobs: width x cap, three seeds inside each.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweeps
  cancel-in-progress: false

jobs:
  language:
    strategy:
      fail-fast: false
      matrix:
        width: [32, 64, 128]
        cap: [1.0, 5.0]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: width ${{ matrix.width }} cap ${{ matrix.cap }}
        run: python experiments/g10_01_first_language.py --width ${{ matrix.width }} --scale 256 --cap ${{ matrix.cap }} --workers 3 --json out/X-${{ matrix.width }}-${{ matrix.cap }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g10-01-${{ matrix.width }}-${{ matrix.cap }}
          path: out/*.json

  aggregate:
    needs: [language]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: g10-01-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 6" | tee summary.txt
          python -m tools.summarise_g10_01 | tee -a summary.txt
      - name: Summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: g10-01-summary
          path: |
            summary.txt
            out/*.json
