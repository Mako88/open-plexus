name: sweep-g11-04-does-our-loss-fall-with-width-like-backprops

# THE MEASUREMENT THAT COULD SAY GOAL 1 IS UNREACHABLE.
#
# Filipovich et al. (arXiv:2210.14593) fit compute-optimal scaling laws for
# Direct Feedback Alignment against backpropagation and found the local rule does
# not merely lose a constant -- it loses the EXPONENT. Backprop -0.071, DFA
# -0.040, a shallow network -0.019. A rule that fails to propagate credit deeply
# behaves like a shallower model, the gap WIDENS with scale, and it is invisible
# at small scale. Every number this project has is at small scale.
#
# So this fits `bits ~ width^b` for three arms on the same corpus, same split,
# same widths, and compares b:
#
#   single     our model, one key per token         ceiling is a bigram
#   context    our model, keys from a token pair    ceiling is a trigram
#   backprop   softmax attention, trained by actual backpropagation, with a real
#              optimiser and gradients reaching every parameter
#
# WHAT A FLAT EXPONENT WOULD NOT MEAN, because confusing the two readings is the
# trap this experiment exists to avoid: the delta rule on Wo IS the exact
# gradient for a single linear readout. We are not approximating backprop badly;
# there is no hidden layer to propagate through. A flat exponent is a statement
# about the ARCHITECTURE, and note 035 already predicts one for the single-token
# arm -- the store holds a bigram count table whose effective rank is about 3 at
# every width.
#
# The arm that bears on the learning rule is CONTEXT. If width buys nothing even
# when the ceiling moves, the ceiling was not what was binding.
#
# PREDICTIONS:
#   P1  the single-token arm is FLAT, |b| < 0.02
#   P2  the backprop arm has a clearly negative exponent -- this is the CONTROL,
#       and if it is flat too the width range resolves nothing and the sweep
#       says nothing
#   P3  the context arm is steeper than the single-token arm
#   P4  neither of our arms reaches the backprop arm's exponent
#
# Pre-dispatch control: backprop at width 16, chunk 64, notes corpus reached
# 4.707 bits, against our 5.897 at width 32. The reference is meaningful and it
# already beats us.
#
# RE-SCOPED BEFORE DISPATCH, because of how g11-03 failed. That sweep lost four
# of six cells to its timeout: the store is d x d and the per-step work is a
# matvec, so cost goes as d SQUARED, and width 256 is sixteen times width 64
# rather than four. The estimate had been taken from the cheapest cell.
#
# So: widths 16-128 rather than 32-256 (an 8x range, still enough to fit a
# slope), two seeds, chunk 128, and a training stream capped at 250k characters.
# The most expensive cell here -- backprop at width 128 -- is roughly the cost
# of the g11-03 cell that DID finish.
#
# 12 jobs: 4 widths x 3 arms, two seeds inside each.

on:
  workflow_dispatch:

concurrency:
  group: open-plexus-sweeps
  cancel-in-progress: false

jobs:
  scaling:
    strategy:
      fail-fast: false
      matrix:
        width: [16, 32, 64, 128]
        arm: [single, context, backprop]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: ${{ matrix.arm }} at width ${{ matrix.width }}
        run: python experiments/g11_04_scaling_exponent.py --corpus shakespeare --width ${{ matrix.width }} --scale 128 --mode ${{ matrix.arm }} --workers 2 --json out/X-${{ matrix.arm }}-${{ matrix.width }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g11-04-${{ matrix.arm }}-${{ matrix.width }}
          path: out/*.json

  aggregate:
    needs: [scaling]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # summarise_g11_04 fits the exponent with numpy. The scaling job installs
      # it and this one did not, so the summariser died at import and `tee`
      # returned 0 -- a green step with an empty summary.
      - run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: g11-04-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          set -o pipefail
          echo "cells returned: $(ls out/*.json 2>/dev/null | wc -l) of 12" | tee summary.txt
          python -m tools.summarise_scaling_exponent | tee -a summary.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g11-04-summary
          path: |
            summary.txt
            out/*.json
